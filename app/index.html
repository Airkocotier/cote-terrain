<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Côté Terrain</title>
<meta name="theme-color" content="#2A4FD8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Côté Terrain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>window.COTE_TERRAIN_WEB = true;   /* version web : fiches gardées dans l'appareil, pas de serveur */</script>
<style>
:root{--bg:#F3F4F8;--card:#fff;--ink:#1B1D26;--muted:#626778;--line:#DFE1EA;--pri:#2A4FD8;--pri2:#E7ECFD;--danger:#C62828;--r:12px}
*{box-sizing:border-box}
:root{color-scheme:light}
input,textarea,select{background-color:#fff;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#C9CEDD transparent}
*::-webkit-scrollbar{width:8px;height:6px}*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#C9CEDD;border-radius:99px}*::-webkit-scrollbar-thumb:hover{background:#A9B0C4}
input::placeholder,textarea::placeholder{color:#9AA0B0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:56px}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sync{font-size:12px;opacity:.85;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.26)}
.tbtn svg{width:18px;height:18px;fill:currentColor}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.banner{background:#FFF4D6;border:1px solid #F2D27A;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
/* ----- appui long sur une carte (1.10.8) ----- */
#app .card[data-a="open"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#app .card.lp{transform:scale(.97);transition:transform .45s ease;box-shadow:0 0 0 3px var(--pri)}
.cm-t{margin:0 0 10px;font-size:17px;line-height:1.3}.cm{display:grid;gap:6px}
.cm button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;background:#F3F5FB;padding:13px 14px;font-size:16px;font-weight:600;color:var(--ink)}
.cm button:hover{background:#E8ECF7}.cm button svg{width:20px;height:20px;fill:currentColor}.cm .cm-del{color:#C62828;background:#FDECEC}
/* ----- aperçu avant impression (1.10.3) ----- */
.pvw{position:fixed;inset:0;z-index:60;background:#5B6070;display:flex;flex-direction:column}
.pv-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:#1B1D26;color:#fff}.pv-top b{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-top .btn svg{width:16px;height:16px;vertical-align:-3px}.pv-top .btn:not(.pri),.pv-top .sp-x{color:#1B1D26}.pv-top .btn svg{fill:currentColor}.pv-top .sp-x{width:40px;height:40px;font-size:19px;flex:0 0 40px}
.pv-pages{flex:1;overflow:auto;padding:16px 12px 40px;-webkit-overflow-scrolling:touch}
.pv-page{background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);margin:0 auto;position:relative;overflow:hidden}
.pv-page svg{display:block}.pv-page.side svg{position:absolute;left:0;top:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
.pv-n{color:#E5E8F0;font-size:13px;margin:6px 0 16px;text-align:center}
.pv-z{display:flex;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden}.pv-z button{background:none;border:0;color:#fff;font-size:18px;padding:7px 11px;min-width:40px}.pv-z .pv-zl{font-size:13px;min-width:58px}
.pv-rotb.on{background:#FFD54F}
.pv-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(27,29,38,.85);color:#fff;font-size:13px;pointer-events:none;white-space:nowrap;animation:pvh 4s forwards}@keyframes pvh{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (hover:hover) and (pointer:fine){.pv-hint{display:none}}
@media (max-width:640px){.pv-top{gap:5px;padding-left:8px;padding-right:8px}.pv-top .btn span,.pv-top b{display:none}.pv-top .pv-z{margin-right:auto}.pv-top .btn{padding:8px 10px}}
/* ----- rotations 5-1 (1.10) ----- */
.rot{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:14px;align-items:start}
.rot-side{display:grid;gap:12px;position:sticky;top:68px}.rot-main{display:grid;gap:12px}
.rot-ps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 8px}
.rot-p{border:0;border-radius:10px;padding:12px 0;font-size:17px;font-weight:800;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink)}
.rot-p.on{background:var(--pri);color:#fff;box-shadow:none}
.rot-next{width:100%}.rot-hint{color:var(--muted);font-size:13px;margin:8px 0 0;line-height:1.45}
.rot-rs{display:flex;align-items:center;gap:8px;margin:4px 0}.rot-rs span{flex:0 0 96px;font-size:14px;font-weight:600}.rot-rs select{flex:1;min-width:0;padding:7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}
.rot-roles{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.rot-court .ed-svg{max-height:70vh}.rot-txt h3{margin:4px 0 6px;font-size:16px}.rot-txt p{margin:0 0 10px;font-size:16px;line-height:1.55}
.rot-chk{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:3px;font-size:14px}.rot-chk .ok{color:#1E7B34}.rot-chk .ko{color:#C62828;font-weight:700}
.rot-src{margin-top:8px;font-size:13px}.rot-src summary{cursor:pointer;color:var(--muted)}.rot-src ul{margin:6px 0 0;padding-left:18px}
@media (max-width:860px){.rot{grid-template-columns:1fr}.rot-side{position:static}}
/* ----- mode lecture (1.9) ----- */
.rd-h{margin:0 0 12px}.rd-h h2{font-size:24px;margin:2px 0 8px;line-height:1.2}
.rd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.rd-chips span{background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
.rd-hb{margin-top:8px}.rd-info{margin:6px 0 0;font-size:16px;line-height:1.5}
.rd-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.rd-sch{position:sticky;top:68px;min-height:200px}.rd .ed-svg{touch-action:pan-x pan-y pinch-zoom;max-height:68vh}
.rd-txt{display:grid;gap:10px}.rd-s{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:12px 14px}
.rd-s h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--pri)}
.rd-t{font-size:17px;line-height:1.55}.rd-empty{color:var(--muted);font-size:16px}
.rd-wu{display:grid;gap:12px}.rd-wi{display:grid;grid-template-columns:minmax(200px,340px) minmax(0,1fr);gap:16px;align-items:start}
.rd-wi:not(:has(.rd-wsch)){grid-template-columns:1fr}
.rd-wsch svg{width:100%;height:auto;display:block}.rd-wtx h3{margin:2px 0 6px;font-size:19px}.rd-wtx p{margin:0 0 6px;font-size:17px;line-height:1.5}
.rd-ok{color:var(--pri);font-weight:600}
.sv{position:relative}
.sv-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;height:calc(100vh - 56px - 28px - 66px);height:calc(100dvh - 56px - 28px - 66px);overscroll-behavior-x:contain}
.sv-track::-webkit-scrollbar{display:none}
.sv-slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:2px 4px 16px}
.sv-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -1px 0 var(--line),0 -6px 18px rgba(20,30,70,.06)}
.sv-nav>.btn{min-width:64px;font-size:18px;padding:10px 14px}
.sv-mid{flex:1;min-width:0;text-align:center}.sv-mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-dots{display:flex;justify-content:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.sv-dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#C9CEDD}.sv-dots button.on{background:var(--pri);width:22px;border-radius:6px}
.sv-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;box-shadow:0 0 0 1px var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px}
.sv-step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--pri2);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center}
.sv-step .th svg{width:58px;height:auto;display:block}.sv-step .t{flex:1;min-width:0}.sv-step .t b{display:block;font-size:16px}.sv-step .t small{color:var(--muted)}
.sv-step .go{font-size:26px;color:var(--muted)}.sv-hint{color:var(--muted);text-align:center;font-size:15px}
.sv-cover{max-width:760px;margin:0 auto}
@media (max-width:860px){.rd-grid{grid-template-columns:1fr}.rd-sch{position:static}.rd-wi{grid-template-columns:1fr}.rd-h h2{font-size:21px}.rd-t{font-size:16px}}
.banner.bkrem{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#EAF2FF;border-color:#A9C4F5}
.banner.bkrem>span:first-child{flex:1 1 320px}.banner .bkb{display:flex;gap:6px;flex-wrap:wrap}.banner .bkb .btn{margin:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;max-width:220px;border:0;background:#fff;border-radius:999px;padding:9px 12px;font-weight:600;color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
.tab.on{background:var(--pri);color:#fff;box-shadow:none}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;outline:none}
.search:focus{border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px 4px 7px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip.on{border-color:transparent;font-weight:600}
.bm{width:9px;height:11px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,30,60,.08),0 0 0 1px var(--line);padding:12px;display:flex;gap:12px;cursor:pointer;text-align:left;border:0;width:100%}
.card:hover{box-shadow:0 4px 14px rgba(20,30,60,.12),0 0 0 1px var(--line)}
.card .th{flex:none;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line)}
.card .th svg{display:block}
.card h3{margin:0 0 3px;font-size:16px;line-height:1.25}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 5px;border-radius:5px;font-size:11.5px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--pri);color:#fff;border:0;border-radius:16px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(42,79,216,.35);display:flex;align-items:center;gap:8px}
.menu{position:fixed;right:18px;bottom:82px;z-index:31;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;min-width:250px}
.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:13px 16px}
.menu button:hover{background:var(--pri2)}
.menu small{display:block;color:var(--muted);font-size:12px}
.page{display:grid;grid-template-columns:minmax(330px,1.1fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.page{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}   /* tablette : schéma à gauche, explications à droite */
@media (max-width:599px){.page{grid-template-columns:1fr}}
.page>*,.ed,.ed>*{min-width:0}
@media (max-width:640px){.tbtn span{display:none}.tbtn{padding:8px}.top .sync{display:none}.top{gap:6px;padding:8px 10px}.wrap{padding:10px}.panel{padding:10px}}
.panel{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:14px}
.panel h2{font-size:15px;margin:0 0 10px;color:var(--pri)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
.f textarea{resize:vertical;min-height:62px;line-height:1.4}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.addcat{display:flex;gap:6px;margin-top:4px}
.addcat input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
/* éditeur */
.ed{display:flex;flex-direction:column;gap:8px}
.ed-phases{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ph{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.ed-phname{display:flex;gap:6px;align-items:center}
.ed-phname input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 9px;outline:none;font-size:14px}
.ed-groups{display:flex;gap:4px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.grp{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.grp:hover{background:#F1F3F9}
.grp.on{background:var(--pri2);color:var(--pri)}
.ed-tools{display:flex;gap:5px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.tool{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:66px;padding:5px 2px 4px;transition:background .15s,border-color .15s;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.1;color:var(--ink)}
.tool svg{width:30px;height:30px}
.tool.on{border-color:var(--pri);background:var(--pri2);box-shadow:0 0 0 1px var(--pri) inset}
.ed-canvas{background:#fff;border-radius:10px;box-shadow:0 0 0 1px var(--line);display:flex;justify-content:center;padding:6px}
.ed-svg{display:block;width:100%;max-height:72vh;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-hint{font-size:12.5px;color:var(--muted);min-height:18px}
.ed-svg.penmode{touch-action:pan-y pinch-zoom}
/* ----- Vue 3D ----- */
.v3d{position:fixed;inset:0;z-index:80;background:#DCE5F2;touch-action:none;user-select:none;-webkit-user-select:none}
.v3d-c{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3d-top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
.v3d-top b{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px;font-size:15px}.v3d-top b small{color:#7a3fd0;font-weight:700}
.v3d-ph{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}.v3d-ph:empty{display:none}
.v3d-x{margin-left:auto;pointer-events:auto;border:0;background:#fff;border-radius:999px;width:40px;height:40px;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.v3d-bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.v3d-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.92);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.v3d-row button,.v3d-row select{border:1px solid #D5DBE7;background:#fff;border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer;color:#1d2433}
.v3d-row button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.v3d-row .v3d-pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.v3d-hint{font-size:12px;color:#3B4A63;background:rgba(255,255,255,.75);border-radius:999px;padding:3px 10px}
/* ----- Ressources ----- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.rcard .rh{display:flex;gap:10px;align-items:flex-start}
.rcard .ri{font-size:22px;line-height:1;flex:none;width:30px;text-align:center}
.rcard h3{margin:0;font-size:15.5px;line-height:1.3}
.rcard .rs{font-size:12.5px;color:var(--muted)}
.rcard p{margin:0;font-size:13.5px;line-height:1.45}
.rcard .rt{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.rcard .tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#EEF1F7;color:#3B4A63}
.rcard .tag.fr{background:#E6EEFF;color:#1E4FD8}.rcard .tag.en{background:#FFF1E0;color:#A55A00}
.rcard a.btn{text-decoration:none;margin-left:auto}
.rcard.mine{border-color:#C9D7FB;background:#FAFCFF}
.rnote{font-size:13px;color:var(--muted);margin:2px 0 12px}
.chips [data-a="rflt"]{padding:6px 12px}.chips [data-a="rflt"].on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
/* ----- mode « Éditer en grand » : le terrain occupe tout l'écran, les outils sur le côté (ou en bas en portrait) ----- */
.ed-side{display:contents}
.ed:not(.full) .ed-panel{order:2}.ed:not(.full) .ed-bar{order:3}
body.edfull{overflow:hidden}
.ed.full{position:fixed;inset:0;z-index:55;background:var(--bg,#F3F5FA);padding:10px;gap:8px 12px;display:grid;
  grid-template-columns:minmax(0,1fr) clamp(380px, 27vw, 560px);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"cv ph" "cv pn" "cv side" "cv bar"}
.ed.full .ed-phases{grid-area:ph}.ed.full .ed-phname{grid-area:pn}.ed.full .ed-bar{grid-area:bar}
.ed.full .ed-canvas{grid-area:cv;min-height:0;align-items:center}
.ed.full .ed-svg{width:100%;height:100%;max-height:none}
.ed.full .ed-side{grid-area:side;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;background:#fff;border-radius:12px;padding:10px;box-shadow:0 0 0 1px var(--line)}
/* « Éditer en grand » : colonne d'outils plus large et boutons plus gros, faciles à toucher au doigt ou à la souris */
.ed.full .ed-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ed.full .tool{width:auto;min-width:0;min-height:78px;justify-content:center;gap:5px;font-size:13.5px;border-radius:12px;padding:8px 4px}

<script>
/* ---------- APPLI ANDROID ----------
   Dans l'APK, la page tourne dans une « WebView » (un navigateur intégré à l'appli). L'appli lui donne un objet
   « CTA » (pont Java ↔ JavaScript). On fait passer par lui les mêmes demandes que vers le serveur (api.php) :
   les fiches sont alors des fichiers .json dans la mémoire de la tablette, comme sur le PC. */
if (window.CTA){
  try { window.COTE_TERRAIN_ANDROID = JSON.parse(CTA.info()); } catch (e){ window.COTE_TERRAIN_ANDROID = {}; }
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opt = {}) => {
    if (typeof url === "string" && url.startsWith("api.php")){
      const r = CTA.api(url, opt.method || "GET", typeof opt.body === "string" ? opt.body : "");
      const cut = r.indexOf("\n");
      return Promise.resolve(new Response(r.slice(cut + 1), {status:+r.slice(0, cut), headers:{"Content-Type":"application/json"}}));
    }
    return realFetch(url, opt);
  };
}
const blobToB64 = async b => { const u = new Uint8Array(await b.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
"use strict";

   FICHES VOLLEY — version web
   Même format de données que l'appli Android (AppData) : un fichier .json
   exporté ici s'importe dans l'appli, et inversement.
   ===================================================================== */

  constructor(m){ this.m = m || [1,0,0,1,0,0]; this.st = []; }
  save(){ this.st.push(this.m.slice()); }
  restore(){ this.m = this.st.pop(); }
  mul(n){ const m = this.m; this.m = [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]]; }
  rotate(deg, cx, cy){ if (!deg) return; const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); this.mul([c, s, -s, c, cx - c*cx + s*cy, cy - s*cx - c*cy]); }
  pt(x, y){ const m = this.m; return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]]; }
  get k(){ return Math.hypot(this.m[0], this.m[1]); }
  upright(x, y){ const [X, Y] = this.pt(x, y), k = this.k; this.save(); this.m = [k, 0, 0, k, X, Y]; } // repère droit centré sur (x,y)
}
class SvgPainter extends Painter {
  constructor(m){ super(m); this.o = []; }

  circle(cx, cy, r, o){ const [x, y] = this.pt(cx, cy); this.o.push(`<circle cx="${r3(x)}" cy="${r3(y)}" r="${r3(r * this.k)}"${this.a(o)}/>`); }
  poly(pts, o){ const T = pts.map(p => this.pt(p[0], p[1])); this.o.push(`<path d="M${T.map(p => r3(p[0]) + " " + r3(p[1])).join("L")}${o.closed ? "Z" : ""}"${this.a(o)}/>`); }
  text(x, y, s, fs, o){ const [X, Y] = this.pt(x, y); this.o.push(`<text x="${r3(X)}" y="${r3(Y)}" dy=".35em" text-anchor="middle" font-size="${r3(fs * this.k)}" font-weight="700" fill="${o.color}" font-family="Roboto,Arial,Helvetica,sans-serif">${esc(s)}</text>`); }
  out(){ return this.o.join(""); }
}
class PdfPainter extends Painter {
  constructor(doc, m){ super(m); this.doc = doc; }
  sty(o){ const d = this.doc; if (o.fill) d.setFillColor(o.fill); if (o.stroke){ d.setDrawColor(o.stroke); d.setLineWidth(o.sw * this.k); } return o.fill && o.stroke ? "FD" : o.fill ? "F" : "S"; }
  circle(cx, cy, r, o){ const [x, y] = this.pt(cx, cy); const md = this.sty(o); this.doc.circle(x, y, r * this.k, md); }
  poly(pts, o){
    const d = this.doc, T = pts.map(p => this.pt(p[0], p[1])); if (T.length < 2) return;
    const md = this.sty(o), rel = [];
    for (let i = 1; i < T.length; i++) rel.push([T[i][0] - T[i-1][0], T[i][1] - T[i-1][1]]);
    if (o.dash) d.setLineDashPattern(o.dash.map(v => v * this.k), 0);
    d.lines(rel, T[0][0], T[0][1], [1, 1], md, !!o.closed);
    if (o.dash) d.setLineDashPattern([], 0);
  }
  text(x, y, s, fs, o){ const d = this.doc, [X, Y] = this.pt(x, y); d.setFont("helvetica", "bold"); d.setFontSize(fs * this.k / 0.3528); d.setTextColor(o.color); d.text(pdfTxt(s), X, Y, {align:"center", baseline:"middle"}); }
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function arcPts(cx, cy, r, a0, a1, n = 10){ const o = []; for (let i = 0; i <= n; i++){ const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return o; }
function rrPts(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); return [...arcPts(x + w - r, y + r, r, -90, 0, 4), ...arcPts(x + w - r, y + h - r, r, 0, 90, 4), ...arcPts(x + r, y + h - r, r, 90, 180, 4), ...arcPts(x + r, y + r, r, 180, 270, 4)]; }

function drawCourt(P, view){
  const H = CH(view);
  P.poly(rectPts(0, 0, CW, H), {fill:"#fff", closed:true});
  if (view === "HALF"){
    P.poly(rectPts(2, 0, 9, 1.5), {fill:mix(PEACH, .4), closed:true});
    P.poly(rectPts(2, 1.5, 9, 9), {fill:PEACH, closed:true});
    P.poly([[2, 0], [2, 10.5], [11, 10.5], [11, 0]], {stroke:LINE, sw:.1});
    P.poly([[2, 4.5], [11, 4.5]], {stroke:LINE, sw:.1});
    P.poly([[2, 10.5], [2, 11.1]], {stroke:LINE, sw:.07}); P.poly([[11, 10.5], [11, 11.1]], {stroke:LINE, sw:.07});
    P.poly([[1, 1.5], [12, 1.5]], {stroke:LINE, sw:.14});
    P.circle(1, 1.5, .2, {fill:LINE}); P.circle(12, 1.5, .2, {fill:LINE});
  } else {
    P.poly(rectPts(2, 3, 9, 18), {fill:PEACH, stroke:LINE, sw:.1, closed:true});
    P.poly([[2, 9], [11, 9]], {stroke:LINE, sw:.1}); P.poly([[2, 15], [11, 15]], {stroke:LINE, sw:.1});
    for (const [x, y, d] of [[2, 3, -.6], [11, 3, -.6], [2, 21, .6], [11, 21, .6]]) P.poly([[x, y], [x, y + d]], {stroke:LINE, sw:.07});
    P.poly([[1, 12], [12, 12]], {stroke:LINE, sw:.14});
    P.circle(1, 12, .2, {fill:LINE}); P.circle(12, 12, .2, {fill:LINE});
  }
}
// Étiquette d'action écrite en toutes lettres sous la joueuse, dans la couleur de l'action
function drawActionTag(P, ac, x, y){
  const txt = ac.label.charAt(0).toLowerCase() + ac.label.slice(1), fs = .31, w = textW(txt) * fs, padX = .14, hgt = fs * 1.3;
  P.upright(x, y);
  const top = .47;
  P.poly(rrPts(-w / 2 - padX, top, w + 2 * padX, hgt, ac.square ? .08 : hgt / 2), {fill:ac.color, stroke:"#fff", sw:.05, closed:true});
  P.text(0, top + hgt / 2, txt, fs, {color:"#fff"});
  P.restore();
}
// Bonhomme de profil, en mètres, centré sur la joueuse (tête en haut, pieds en bas)
function drawFigure(P, p, x, y){
  const color = (ROLES[p.role] && ROLES[p.role].color) || TEAM[p.team] || TEAM.A;
  const F = {
    PASSE:{head:[0, -.72], body:[[0, -.55], [0, -.06]], legs:[[[0, -.06], [-.15, .24], [-.13, .55]], [[0, -.06], [.15, .24], [.14, .55]]],
      arms:[[[-.05, -.5], [-.3, -.7], [-.15, -1.0]], [[.05, -.5], [.3, -.7], [.15, -1.0]]], ball:[0, -1.17]},
    MANCHETTE:{head:[.27, -.6], body:[[.17, -.42], [0, 0]], legs:[[[0, 0], [.24, .2], [.06, .52]], [[0, 0], [-.12, .26], [-.26, .52]]],
      arms:[[[.17, -.4], [.42, -.26], [.62, -.12]]], ball:[.79, -.2]},
    SERVICE:{head:[0, -.72], body:[[0, -.55], [0, -.06]], legs:[[[0, -.06], [-.18, .25], [-.26, .55]], [[0, -.06], [.12, .27], [.21, .55]]],
      arms:[[[.04, -.5], [.27, -.78], [.34, -1.04]], [[-.04, -.5], [-.28, -.58], [-.42, -.76]]], ball:[.42, -1.21]},
    ATTAQUE:{head:[-.02, -.84], body:[[0, -.67], [.04, -.18]], legs:[[[.04, -.18], [-.16, .02], [-.04, .26]], [[.04, -.18], [.2, .02], [.24, .28]]],
      arms:[[[.02, -.62], [.22, -.95], [.38, -1.18]], [[-.02, -.62], [-.25, -.8], [-.36, -1.0]]], ball:[.5, -1.32]}
  }[p.geste];
  const S = 1.35, k = q => [q[0] * S, q[1] * S];          // taille du bonhomme
  P.upright(x, y - .1);
  const stroke = l => { P.poly(l.map(k), {stroke:"#fff", sw:.24}); P.poly(l.map(k), {stroke:color, sw:.14}); };
  [F.body, ...F.legs].forEach(stroke);
  P.circle(...k(F.head), .19 * S, {fill:color, stroke:"#fff", sw:.06});
  const lab = (p.label || "").slice(0, 3);
  if (lab) P.text(...k(F.head), lab, lab.length <= 1 ? .3 : .21, {color:p.role === "LIBERO" ? "#0B2530" : "#fff"});
  F.arms.forEach(stroke);                                     // les bras passent devant la tête (passe à 10 doigts)
  drawBallAt(P, ...k(F.ball), .17, 20);
  P.restore();
}
function drawPlayerAt(P, p, x, y, badgeOnly){
  if (p.geste && GESTES[p.geste] && betaOn() && !badgeOnly){ drawFigure(P, p, x, y); const ac0 = ACTIONS[p.action]; if (ac0){ P.upright(x, y + .35); drawActionTag(P, ac0, 0, 0); P.restore(); } return; }
  const staff = p.team === "COACH" || p.team === "ASSISTANT";
  const fill = (ROLES[p.role] && ROLES[p.role].color) || TEAM[p.team] || TEAM.A;
  const PR = .42;                                   // rayon d'une joueuse, en mètres
  if (staff){ P.upright(x, y); P.poly(rrPts(-PR, -PR, 2*PR, 2*PR, .14), {fill, stroke:"#fff", sw:.06, closed:true}); P.restore(); }
  else { const ring = p.role !== "NONE" && p.team === "B"; P.circle(x, y, PR, {fill, stroke:ring ? TEAM.B : "#fff", sw:ring ? .12 : .06}); }
  const lab = (p.label || "").slice(0, 3);
  if (lab) P.text(x, y, lab, lab.length <= 1 ? .54 : lab.length === 2 ? .4 : .32, {color:p.role === "LIBERO" ? "#0B2530" : "#fff"});
  const ac = ACTIONS[p.action];
  if (ac){ if (badgeOnly){ P.upright(x, y); drawBadge(P, ac, .4, -.4, .27); P.restore(); } else drawActionTag(P, ac, x, y); }
}
/* ---------- Préférences (choix du ballon…) : gardées sur l'appareil et dans la base ---------- */
const PREF_KEY = "fichesVolley.prefs";
let PREFS = (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}") || {}; } catch (e){ return {}; } })();
function setPref(k, v){
  PREFS[k] = v;
  try { localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); } catch (e){}
  if (Store.mode === "db") Store.queue("prefs", {op:"set", body:() => ({kind:"prefs", ...PREFS})}, true);
}
// Styles de ballon : panneaux de couleur qui tournent en spirale (comme les vrais ballons)
const BALLS = {
  molten:{name:"Molten", desc:"rouge, vert et blanc", panels:["#D7192A", "#FFFFFF", "#00843D", "#D7192A", "#FFFFFF", "#00843D"]},
  mikasa:{name:"Mikasa", desc:"bleu et jaune", panels:["#FFD100", "#0057B8", "#FFD100", "#0057B8", "#FFD100", "#0057B8"]},
  vintage:{name:"À l'ancienne", desc:"cuir blanc cousu", panels:["#F3ECDD", "#F3ECDD", "#F3ECDD"], seams:2, line:"#9C8A72", shade:"#D9CDB4"}
};
function drawBallAt(P, x, y, r, rot = 0, style){
  const st = BALLS[style || PREFS.ball] || BALLS.molten, n = st.panels.length, tw = 1.0, base = rot * Math.PI / 180;
  // bord d'un panneau : part du centre et s'enroule jusqu'au bord du ballon
  const edge = a => Array.from({length:9}, (_, i) => { const t = i / 8; return [x + r*t*Math.cos(a + tw*t), y + r*t*Math.sin(a + tw*t)]; });
  P.circle(x, y, r, {fill:"#FFFFFF"});
  for (let k = 0; k < n; k++){
    if (st.panels[k] === "#FFFFFF") continue;
    const a0 = base + k * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
    const arc = arcPts(x, y, r, (a0 + tw) * 180 / Math.PI, (a1 + tw) * 180 / Math.PI, 6);
    P.poly([...edge(a0), ...arc, ...edge(a1).reverse()], {fill:st.panels[k], closed:true});
  }
  if (st.shade) P.poly(arcPts(x, y, r * .93, 20, 160, 10), {stroke:st.shade, sw:r * .14});   // léger relief du cuir
  for (let k = 0; k < n; k++){
    const a = base + k * 2 * Math.PI / n;
    P.poly(edge(a), {stroke:st.line || "#555555", sw:r * (st.seams ? .06 : .07)});
    for (let j = 1; j <= (st.seams || 0); j++){              // coutures parallèles : les bandes de cuir
      const e = edge(a), d = j * r * .19, pts = [];
      for (let i = 1; i < e.length; i++){
        const [x0, y0] = e[i - 1], [x1, y1] = e[i], L = Math.hypot(x1 - x0, y1 - y0) || 1;
        const q = [x1 - (y1 - y0) / L * d, y1 + (x1 - x0) / L * d];
        if (Math.hypot(q[0] - x, q[1] - y) < r * .97) pts.push(q);
      }
      if (pts.length > 1) P.poly(pts, {stroke:st.line, sw:r * .04});
    }
  }
  P.circle(x, y, r, {stroke:st.seams ? "#5D5040" : "#222", sw:r * .1});
}
function drawEquipAt(P, e, x, y){
  P.save(); P.rotate(e.rotation || 0, x, y);
  switch (e.kind){
    case "BALL": drawBallAt(P, x, y, .36, e.rotation || 0); break;
    case "CONE": { const s = .4; P.poly([[x, y - s], [x + s*.85, y + s*.7], [x - s*.85, y + s*.7]], {fill:"#FF7A00", stroke:"#222", sw:.04, closed:true}); break; }
    case "TARGET": P.circle(x, y, .6, {fill:TEAM.B}); P.circle(x, y, .4, {fill:"#fff"}); P.circle(x, y, .2, {fill:TEAM.B}); break;
    case "CART": { const rw = .65, rh = .45;
      for (const a of [-1, 1]) for (const b of [-1, 1]) P.circle(x + a*rw, y + b*rh, .11, {fill:"#37474F"});
      P.poly(rectPts(x - rw, y - rh, 2*rw, 2*rh), {fill:"#CFD8DC", stroke:"#37474F", sw:.07, closed:true});
      for (const r of [-.5, .5]) for (const c of [-.62, 0, .62]) drawBallAt(P, x + c*rw, y + r*rh, .18, (r + c) * 90); break; }
    case "LADDER": { const h = EQ_HALF.LADDER, w = .25;
      for (let i = 0; i < 9; i++){ const yy = y - h + .2 + i * (2*h - .4) / 8; P.poly([[x - w, yy], [x + w, yy]], {stroke:"#FDD835", sw:.09}); }
      P.poly([[x - w, y - h], [x - w, y + h]], {stroke:"#212121", sw:.07}); P.poly([[x + w, y - h], [x + w, y + h]], {stroke:"#212121", sw:.07}); break; }
    case "HURDLE": { const h = .5, t = .09, f = .12;
      P.poly(rectPts(x - h, y - t, 2*h, 2*t), {fill:"#D32F2F", closed:true}); P.poly(rectPts(x - h*.33, y - t, h*.66, 2*t), {fill:"#fff", closed:true});
      P.poly(rectPts(x - h - f/2, y - 2*f, f, 4*f), {fill:"#212121", closed:true}); P.poly(rectPts(x + h - f/2, y - 2*f, f, 4*f), {fill:"#212121", closed:true}); break; }
    case "HOOP": P.circle(x, y, .4, {stroke:"#43A047", sw:.09}); break;
    case "SLAT": P.poly(rrPts(x - .5, y - .06, 1, .12, .05), {fill:"#0288D1", closed:true}); break;
    case "MEDBALL": P.circle(x, y, .4, {fill:"#4E342E"}); P.poly([[x - .4, y], [x + .4, y]], {stroke:"#BCAAA4", sw:.06}); break;
    case "CHAIR": { const s = .3; P.poly(rectPts(x - s, y - s, 2*s, 2*s), {fill:"#78909C", closed:true}); P.poly(rectPts(x - s, y - s - .12, 2*s, .17), {fill:"#37474F", closed:true}); break; }
    case "STAND": {                     // cible sur pied : panier hexagonal avec filet (en haut), pied en U (en bas)
      P.poly([[x - .45, y + .1], [x - .45, y + .55], [x + .45, y + .55], [x + .45, y + .1]], {stroke:"#212121", sw:.08});
      P.poly([[x, y + .55], [x, y + .25]], {stroke:"#212121", sw:.08});
      const cy = y - .15, R = .38, hex = k => Array.from({length:6}, (_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return [x + k * R * Math.cos(a), cy + k * R * Math.sin(a)]; });
      P.poly(hex(1), {fill:"#E8F1FB", stroke:"#FDD835", sw:.08, closed:true});
      for (let k = -2; k <= 2; k++){ P.poly([[x + k * .1, cy - .24], [x + k * .1, cy + .24]], {stroke:"#9FB4CC", sw:.015}); P.poly([[x - .24, cy + k * .1], [x + .24, cy + k * .1]], {stroke:"#9FB4CC", sw:.015}); }
      P.poly(hex(.8), {stroke:"#1E88E5", sw:.05, closed:true});
      P.circle(x, y + .25, .08, {fill:"#FDD835", stroke:"#5D4A00", sw:.02}); break; }
    case "SPIKER": {                    // perche d'attaque : ballon tenu au bout d'une perche (le ballon en haut à gauche)
      const bx = x - .42, by = y - .42, hx = x + .5, hy = y + .5;
      P.poly([[hx, hy], [bx, by]], {stroke:"#90A4AE", sw:.07});
      P.poly([[hx, hy], [hx - .2, hy - .2]], {stroke:"#9CCC2E", sw:.11});
      P.circle(bx, by, .23, {stroke:"#1E63C6", sw:.09});
      drawBallAt(P, bx, by, .18, 0); break; }
  }
  P.restore();
}
function drawArrowM(P, kind, S, E, C){
  const color = kind === "BALL" ? "#D32F2F" : "#222", head = .5;
  let ang, pts;
  if (C){ ang = Math.atan2(E[1] - C[1], E[0] - C[0]); pts = bez(S, C, [E[0] - Math.cos(ang)*head*.6, E[1] - Math.sin(ang)*head*.6]); }
  else { ang = Math.atan2(E[1] - S[1], E[0] - S[0]); const stop = Math.hypot(E[0] - S[0], E[1] - S[1]) > head ? head*.6 : 0; pts = [S, [E[0] - Math.cos(ang)*stop, E[1] - Math.sin(ang)*stop]]; }
  P.poly(pts, {stroke:color, sw:.12, dash:kind === "MOVE" ? [.4, .3] : null});
  P.poly([E, [E[0] - head*Math.cos(ang - .45), E[1] - head*Math.sin(ang - .45)], [E[0] - head*Math.cos(ang + .45), E[1] - head*Math.sin(ang + .45)]], {fill:color, closed:true});
}
function drawLabel(P, x, y, s){
  if (!s.trim()) return;
  const fs = .55, w = textW(s) * fs, pad = .15;
  P.upright(x, y);
  P.poly(rrPts(-w/2 - pad, -.465*fs - pad, w + 2*pad, .93*fs + 2*pad, .12), {fill:"#fff", op:.9, closed:true});
  P.text(0, 0, s, fs, {color:"#1B1D26"});
  P.restore();
}
const M = (p, H) => [p.x * CW, p.y * H];
function drawDiagram(P, els, view){
  const H = CH(view);
  drawCourt(P, view);
  for (const e of els) if (e.type === "free" && e.points.length > 1) P.poly(e.points.map(p => M(p, H)), {stroke:"#424242", sw:e.w || .1});
  for (const e of els) if (e.type === "arrow") drawArrowM(P, e.kind, M(e.start, H), M(e.end, H), e.control ? M(e.control, H) : null);
  for (const e of els) if (e.type === "equipment") drawEquipAt(P, e, ...M(e.pos, H));
  for (const e of els) if (e.type === "player") drawPlayerAt(P, e, ...M(e.pos, H));
  for (const e of els) if (e.type === "text") drawLabel(P, ...M(e.pos, H), e.text);
}
// SVG prêt à afficher. horizontal = terrain couché (comme la feuille d'échauffement)
function diagramSvg(els, view, {w, h, horizontal = false, extra = ""} = {}){
  const H = CH(view);
  const P = new SvgPainter(horizontal ? [0, -1, 1, 0, 0, CW] : null);
  drawDiagram(P, els, view);
  const vb = horizontal ? `0 0 ${H} ${CW}` : `0 0 ${CW} ${H}`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${w ? ` width="${w}"` : ""}${h ? ` height="${h}"` : ""}>${P.out()}${extra}</svg>`;
}

/* =====================================================================
   STOCKAGE — base de données de la page (privée, par personne),
   avec repli sur ce navigateur si elle n'est pas disponible.
   ===================================================================== */
const LS_KEY = "fichesVolley.v1";
const Store = {
  mode:"loading", db:null, base:null, items:new Map(), extras:{runs:[], cycles:[], links:[], counts:[], wuModels:[]},
  pend:new Map(), timers:new Map(), busy:new Set(), lastErr:null,
  safe(id){ return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, c => "~" + c.charCodeAt(0).toString(16)); },
  key(kind, id){ return KEYS[kind] + this.safe(id); },
  list(kind){ const o = []; for (const v of this.items.values()) if (v.kind === kind) o.push(v.item); return o; },
  get(kind, id){ const v = this.items.get(this.key(kind, id)); return v && v.item; },
  put(kind, item, now){ item.updatedAt = Date.now(); const k = this.key(kind, item.id); this.items.set(k, {kind, item}); this.queue(k, {op:"set", body:() => ({kind, item})}, now); },
  putRaw(kind, item){ const k = this.key(kind, item.id); this.items.set(k, {kind, item}); this.queue(k, {op:"set", body:() => ({kind, item})}, true); },
  remove(kind, id){ const k = this.key(kind, id); this.items.delete(k); this.queue(k, {op:"del"}, true); },
  saveExtras(soon){ this.queue("extras", {op:"set", body:() => ({kind:"extras", ...this.extras})}, !soon); },
  queue(k, job, now){
    this.pend.set(k, job); clearTimeout(this.timers.get(k));
    this.timers.set(k, setTimeout(() => this.flush(k), now ? 0 : 700));
    if (this.api) markPending(k);
    setSync("pending"); this.mirror();
  },
  async flush(k){
    if (!this.db){ this.pend.delete(k); setSync(); return; }
    if (this.busy.has(k)) return;                       // une seule écriture à la fois par fiche
    const job = this.pend.get(k); if (!job) return;
    this.pend.delete(k); this.busy.add(k);
    const ref = this.db.collection(this.base).doc(k);
    let failed = false;
    const run = () => job.op === "del" ? ref.delete() : ref.set(clone(job.body()));
    try {
      try { await run(); }
      catch (e){ if (e && (e.code === "unavailable" || !e.code)){ await new Promise(r => setTimeout(r, 800 + Math.random() * 1200)); await run(); } else throw e; }
      this.lastErr = null;
      if (this.api){ this.offline && (this.offline = false, render()); unmarkPending(k, this.pend.has(k)); }
    } catch (e){
      this.lastErr = e; failed = true;
      const c = e && e.code;
      if (this.api && (c === "unavailable" || c === "auth")){
        if (!this.pend.has(k)) this.pend.set(k, job);      // on garde le changement pour plus tard
        if (c === "auth") askLogin();
        else { if (!this.offline){ this.offline = true; toast("Pas de connexion au serveur : vos changements restent sur cet appareil et partiront dès que possible."); } scheduleRetry(); }
        return;
      }
      if (c === "quota_exceeded") toast("Espace de stockage plein : supprimez définitivement des fiches de la corbeille.");
      else if (c === "invalid_argument") toast("Cette fiche est trop grosse pour être enregistrée (schémas trop chargés ?).");
      else if (c === "revoked") toast("L'accès à l'enregistrement a été retiré. Exportez vos fiches pour ne rien perdre.");
      else toast("Enregistrement impossible pour l'instant. Vos changements restent dans ce navigateur.");
    } finally {
      this.busy.delete(k);
      if (this.pend.has(k) && !(failed && this.offline)) this.flush(k);
      setSync();
    }
  },
  appData(includeTrash = true){
    const f = a => includeTrash ? a : a.filter(x => x.deletedAt == null);
    return {version:1, exercises:f(this.list("exercise")), sessions:f(this.list("session")), warmUps:f(this.list("warmup")), runs:this.extras.runs, cycles:this.extras.cycles, links:this.extras.links || [], counts:this.extras.counts || [], wuModels:this.extras.wuModels || [], teams:this.list("team"), matches:this.list("match")};
  },
  _mt:null,
  mirror(){ clearTimeout(this._mt); this._mt = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(this.appData())); } catch (e){} }, 800); },
  loadAppData(d, merge){
    if (!merge) this.items.clear();
    for (const e of d.exercises || []){ const x = normEx(e); this.items.set(this.key("exercise", x.id), {kind:"exercise", item:x}); }
    for (const w of d.warmUps || []){ const x = normWu(w); this.items.set(this.key("warmup", x.id), {kind:"warmup", item:x}); }
    for (const x of d.sessions || []){ const n = normSe(x); this.items.set(this.key("session", n.id), {kind:"session", item:n}); }
    for (const x of d.teams || []){ const n = normTeam(x); this.items.set(this.key("team", n.id), {kind:"team", item:n}); }
    for (const x of d.matches || []){ const n = normMatch(x); this.items.set(this.key("match", n.id), {kind:"match", item:n}); }
    for (const n of ["runs", "cycles", "links", "counts", "wuModels"]) if (Array.isArray(d[n])) this.extras[n] = d[n];
  }
};
function setSync(){
  const el = $("#sync"); if (!el) return;
  if (Store.mode === "loading") el.textContent = "Chargement…";
  else if (Store.mode === "local" || Store.mode === "web") el.textContent = Store.mode === "web" ? "Gardé sur cet appareil" : "Gardé dans ce navigateur";
  else if (Store.offline) el.textContent = "Hors ligne · gardé sur l'appareil";
  else el.textContent = (Store.pend.size || Store.busy.size) ? "Enregistrement…" : (Store.lastErr ? "Non enregistré" : "Enregistré");
}

// Range un document lu (base Claude ou serveur) dans la bibliothèque.
function ingest(k, v){
  if (!v) return;
  if (v.kind === "exercise" && v.item) Store.items.set(k, {kind:"exercise", item:normEx(clone(v.item))});
  else if (v.kind === "warmup" && v.item) Store.items.set(k, {kind:"warmup", item:normWu(clone(v.item))});
  else if (v.kind === "session" && v.item) Store.items.set(k, {kind:"session", item:normSe(clone(v.item))});
  else if (v.kind === "team" && v.item) Store.items.set(k, {kind:"team", item:normTeam(clone(v.item))});
  else if (v.kind === "match" && v.item) Store.items.set(k, {kind:"match", item:normMatch(clone(v.item))});
  else if (v.kind === "prefs"){ const {kind, _saved, ...rest} = v; PREFS = {...PREFS, ...rest}; try { localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); } catch (e){} }
  else if (v.kind === "extras"){ for (const n of ["runs", "cycles", "links", "counts", "wuModels"]) Store.extras[n] = clone(v[n] || []); for (const x of v.sessions || []) if (!Store.get("session", x.id)) Store.putRaw("session", normSe(clone(x))); }
}
async function boot(){
  applyZoom(); applyOrient();
  render();
  loadJsPdf();
  if (window.COTE_TERRAIN_WEB) return bootWeb();              // version web (iPhone, iPad, Mac…)
  if (!(window.claude && claude.use)) return bootServer();     // page hébergée chez soi / chez OVH
  let db = null, user = null, id = null;
  try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch (e){}
  try { id = user ? await user.id() : null; } catch (e){}
  if (db && id){
    Store.db = db; Store.base = "data/users/" + id;
    const slow = setTimeout(() => { Store.slow = true; render(); }, 10000);
    try {
      const snap = await db.collection(Store.base).get();
      clearTimeout(slow); Store.slow = false;
      let seeded = false;
      for (const d of snap.docs){ const v = d.data(); if (v && v.kind === "meta") seeded = !!v.seeded; else ingest(d.id, v); }
      Store.mode = "db";
      if (!seeded) await seedLibrary();
    } catch (e){
      clearTimeout(slow); Store.slow = false;
      Store.db = null; loadLocal(); Store.dbFailed = true;
    }
  } else loadLocal();
  purgeTrash(); render(); setSync();
  askBallOnce();

/* ---------- MODE SERVEUR (homelab ou OVH) : api.php à côté de la page ----------
   Chaque fiche = un fichier sur le serveur. La page garde aussi une copie dans le navigateur :
   sans réseau, on continue à travailler et les changements partent au retour de la connexion. */
const TOKEN_KEY = "fichesVolley.token", PENDING_KEY = "fichesVolley.pending";
const API = {
  token:null,
  async call(a, {key, body} = {}){
    const q = new URLSearchParams({a}); if (key) q.set("k", key);
    let r;
    try { r = await fetch("api.php?" + q, {method:body === undefined ? "GET" : "POST", cache:"no-store", headers:{"Content-Type":"application/json", "X-Token":this.token || ""}, body:body === undefined ? undefined : JSON.stringify(body)}); }
    catch (e){ throw {code:"unavailable"}; }
    let j = null; try { j = await r.json(); } catch (e){}
    if (r.status === 401) throw {code:"auth"};
    if (!r.ok || !j) throw {code:(j && j.error) || (r.status === 413 ? "invalid_argument" : "unavailable")};
    return j;
  }
};
const apiDb = {collection:() => ({doc:k => ({set:b => API.call("put", {key:k, body:b}), delete:() => API.call("del", {key:k, body:{}})})})};
function pendingKeys(){ try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch (e){ return []; } }
function setPendingKeys(a){ try { localStorage.setItem(PENDING_KEY, JSON.stringify([...new Set(a)])); } catch (e){} }
function markPending(k){ const a = pendingKeys(); if (!a.includes(k)){ a.push(k); setPendingKeys(a); } }
function unmarkPending(k, stillPending){ if (!stillPending) setPendingKeys(pendingKeys().filter(x => x !== k)); }
function jobFor(k){
  const v = Store.items.get(k);
  if (v) return {op:"set", body:() => ({kind:v.kind, item:v.item})};
  if (k === "extras") return {op:"set", body:() => ({kind:"extras", ...Store.extras})};
  if (k === "prefs") return {op:"set", body:() => ({kind:"prefs", ...PREFS})};
  return {op:"del"};
}
let retryTimer = null;
function scheduleRetry(){ if (retryTimer) return; retryTimer = setTimeout(retryNow, 30000); }
function retryNow(){ clearTimeout(retryTimer); retryTimer = null; for (const k of [...Store.pend.keys()]) Store.flush(k); }
window.addEventListener("online", () => { if (Store.api) retryNow(); });
async function bootServer(){
  Store.api = true; Store.db = apiDb; Store.base = "api";
  try { API.token = localStorage.getItem(TOKEN_KEY); } catch (e){}
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  try { const t = localStorage.getItem(LS_KEY); if (t) Store.loadAppData(JSON.parse(t)); } catch (e){}   // copie de l'appareil
  try {
    // 1) on envoie d'abord ce qui a été modifié sans réseau (c'est le plus récent)
    for (const k of pendingKeys()){ const job = jobFor(k); await (job.op === "del" ? apiDb.collection().doc(k).delete() : apiDb.collection().doc(k).set(clone(job.body()))); unmarkPending(k, false); }
    // 2) puis on lit tout ce que le serveur contient
    const r = await API.call("list");
    Store.items.clear(); Store.extras = {runs:[], cycles:[], links:[], counts:[], wuModels:[]};
    for (const [k, v] of Object.entries(r.docs || {})) ingest(k, v);
    Store.offline = false;
  } catch (e){
    if (e.code === "auth"){ Store.mode = "db"; render(); askLogin(); return; }
    if (e.code === "no_password"){ Store.mode = "db"; Store.setup = true; render(); return; }
    Store.offline = true; scheduleRetry();
    for (const k of pendingKeys()) if (!Store.pend.has(k)) Store.pend.set(k, jobFor(k));
  }
  Store.mode = "db";
  purgeTrash(); render(); setSync(); Store.mirror();
  askBallOnce();
  if (window.CTA) setTimeout(() => window.ctShare(), 400);   // appli lancée par un « Partager »
  bkStartAuto();                                               // tablette : sauvegarde automatique + rappel
  // Version PC : un petit signe de vie toutes les 30 s ; CoteTerrain.exe s'arrête tout seul quand plus aucune fenêtre n'est ouverte.
  if (window.COTE_TERRAIN_PC){
    setInterval(() => fetch("api.php?a=ping", {cache:"no-store"}).catch(() => {}), 30000);
    setTimeout(placeWelcome, 600);
    setTimeout(checkUpdate, 5000);                               // version téléchargée sur le site : y a-t-il plus récent ?                               // version Store : choisir le dossier des fiches
  }
}

    <form id="login"><label class="f"><span>Mot de passe</span><input type="password" id="pw" autocomplete="current-password" required></label>
    <div id="pwerr" style="color:var(--danger);min-height:20px"></div><div class="acts"><button class="btn pri">Entrer</button></div></form>`);

    catch (err){ $("#pwerr", d.el).textContent = err.code === "auth" ? "Mot de passe incorrect." : "Le serveur ne répond pas."; }

/* ---------- VERSION WEB (iPhone, iPad, Mac, tout navigateur) ----------
   Pas de serveur : les fiches restent dans le navigateur de l'appareil (comme sur une tablette).
   Le service worker (sw.js) garde une copie de l'appli pour qu'elle s'ouvre sans réseau au gymnase. */
const WEB_KEY = "fichesVolley.web";
let WEB = (() => { try { return JSON.parse(localStorage.getItem(WEB_KEY) || "{}") || {}; } catch (e){ return {}; } })();
function webSet(o){ WEB = {...WEB, ...o}; try { localStorage.setItem(WEB_KEY, JSON.stringify(WEB)); } catch (e){} }
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isInstalled = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
async function bootWeb(){
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  loadLocal(); Store.mode = "web";
  if (!WEB.seeded){                                   // premier lancement : on copie les fiches de départ
    try {
      const r = await fetch("seed/seed.json", {cache:"no-store"}); const list = r.ok ? await r.json() : [];
      for (const v of list){ if (!v || !v.item) continue;
        if (v.kind === "exercise" && !Store.get("exercise", v.item.id)) Store.putRaw("exercise", normEx(clone(v.item)));
        if (v.kind === "warmup" && !Store.get("warmup", v.item.id)) Store.putRaw("warmup", normWu(clone(v.item))); }
      webSet({seeded:true, since:Date.now()});
    } catch (e){}
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e){}   // demande au navigateur de ne pas effacer les fiches
  purgeTrash(); render(); setSync(); Store.mirror();
  askBallOnce();
  setTimeout(installTip, 1500);
}
// Sur iPhone/iPad, Safari ne propose pas lui-même d'installer l'appli : on explique comment faire.

// Rappel de sauvegarde : toutes les 2 semaines, tant que la dernière copie est plus vieille.
const webNeedsBackup = () => Store.mode === "web" && Store.list("exercise").length > 1 && (WEB.bkLater || 0) < Date.now() && Date.now() - (WEB.lastExport || WEB.since || Date.now()) > 14 * DAY;
// Fiches fournies d'office (rangées dans la partie partagée « seed » de la base) : copiées une seule fois.
async function seedLibrary(){
  try {
    const s = await Store.db.collection("seed").get();
    if (!s.docs.length) return;
    for (const d of s.docs){
      const v = d.data(); if (!v || !v.item) continue;
      if (v.kind === "exercise" && !Store.get("exercise", v.item.id)) Store.putRaw("exercise", normEx(clone(v.item)));
      if (v.kind === "warmup" && !Store.get("warmup", v.item.id)) Store.putRaw("warmup", normWu(clone(v.item)));
    }
    await Store.db.collection(Store.base).doc("meta").set({kind:"meta", seeded:true, at:Date.now()});
  } catch (e){}
}
function purgeTrash(){
  const limit = Date.now() - 30 * 864e5;
  for (const kind of ["exercise", "warmup", "session"]) for (const x of Store.list(kind)) if (x.deletedAt != null && x.deletedAt < limit) Store.remove(kind, x.id);
}

/* =====================================================================
   INTERFACE : petites briques (toast, boîtes de dialogue)
   ===================================================================== */
function toast(msg, action){
  const t = document.createElement("div"); t.className = "tst";
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { action.run(); t.remove(); };
  $("#toast").appendChild(t); setTimeout(() => t.remove(), action ? 7000 : 4200);
}
function dialog(html, {big = false, onClose} = {}){
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="dlg${big ? " big" : ""}">${html}</div>`;
  const close = () => { ov.remove(); onClose && onClose(); };
  ov.addEventListener("pointerdown", e => { if (e.target === ov) ov._down = true; });
  ov.addEventListener("click", e => { if (e.target === ov && ov._down) close(); ov._down = false; });
  $("#layer").appendChild(ov);
  return {el:ov.firstChild, close};
}
function confirmBox(text, ok = "Confirmer", danger = true){
  return new Promise(res => {
    const d = dialog(`<p style="margin:0 0 4px">${esc(text)}</p><div class="acts"><button class="btn" data-x="0">Annuler</button><button class="btn ${danger ? "dng" : "pri"}" data-x="1">${esc(ok)}</button></div>`, {onClose:() => res(false)});
    d.el.addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (b){ const v = b.dataset.x === "1"; d.el.parentNode.remove(); res(v); } });
  });
}
async function saveFile(filename, data){
  if (window.CTA){
    const blob = data instanceof Blob ? data : new Blob([data], {type:filename.endsWith(".json") ? "application/json" : "application/octet-stream"});
    const mime = filename.endsWith(".pdf") ? "application/pdf" : filename.endsWith(".json") ? "application/json" : (blob.type || "application/octet-stream");
    const r = CTA.saveFile(filename, mime, await blobToB64(blob));
    toast(r); return !/^Erreur/.test(r);
  }
  let dl = null;
  try { dl = window.claude && claude.use ? await claude.use("downloads") : null; } catch (e){}
  if (!dl){
    if (window.claude){ toast("Le téléchargement n'est pas disponible dans cette vue."); return false; }
    const blob = data instanceof Blob ? data : new Blob([data], {type:filename.endsWith(".json") ? "application/json" : "application/octet-stream"});
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000); return true;
  }
  try { await dl.save({filename, data}); return true; }
  catch (e){
    const c = e && e.code;
    if (c === "declined") return false;
    if (c === "rate_limited") toast("Une demande d'enregistrement est déjà ouverte.");
    else toast("Le fichier n'a pas pu être enregistré ici.");
    return false;
  }
}

// Fait défiler la page (ou le cadre qui défile) quand on glisse sur le terrain : le terrain bloque le défilement natif pour pouvoir dessiner.
function scrollPage(from, dy){
  if (!dy) return;
  for (let n = from.parentElement; n && n !== document.body; n = n.parentElement){
    const o = getComputedStyle(n).overflowY;
    if ((o === "auto" || o === "scroll") && n.scrollHeight > n.clientHeight + 1){ n.scrollTop += dy; return; }
  }
  (document.scrollingElement || document.documentElement).scrollTop += dy;
}

       Deux doigts font défiler la page ; un doigt sur une zone vide aussi (outil « Choisir »).
     - stylet : plus précis ; son bouton ouvre le menu, son bout gomme efface, la pression règle l'épaisseur du dessin libre.
       Quand il touche l'écran, la paume posée est ignorée. En mode stylet, le doigt ne fait que défiler.
     - souris : le clic droit ouvre le menu. */
  down(ev){
    if (this.readonly || this.anim) return;
    const pen = ev.pointerType === "pen", touch = ev.pointerType === "touch";
    if (touch && (PREFS.pen || this.penDown)) return;             // paume, ou mode stylet : le doigt laisse défiler
    if (pen && PREFS.pen === undefined){ setPref("pen", true); this.renderBar(); toast("Stylet détecté : le stylet dessine, le doigt fait défiler. Bouton ✏️ Stylet pour changer."); }
    if (touch){
      this.touches.set(ev.pointerId, ev.clientY);
      if (this.touches.size >= 2){ this.cancelGesture(); this.drag = {mode:"scroll2", y:null}; return; }
    }
    ev.preventDefault();
    this.closeMenu();
    const p = this.toM(ev), H = this.H, t = TOOLS[this.tool], tol = pen ? .4 : .55;
    if (ev.button === 2 || (pen && (ev.buttons & 2))){              // clic droit / bouton du stylet : menu immédiat
      const h = hitTest(this.els, p, H, {tol}); if (h){ this.sel = h.id; this.renderSvg(); this.renderPanel(); this.openMenu(h, ev.clientX, ev.clientY); }
      return;
    }
    const eraserTip = pen && (ev.button === 5 || (ev.buttons & 32));
    if (ev.button > 0 && !eraserTip) return;
    try { this.svg.setPointerCapture(ev.pointerId); } catch (e){}
    if (pen) this.penDown = true;
    this.snapKey = null;
    if (eraserTip){ this.drag = {mode:"penErase"}; this.eraseAt(p); return; }
    this.press = {x:ev.clientX, y:ev.clientY, mouse:ev.pointerType === "mouse"};
    if (!this.press.mouse && this.tool !== "erase"){                  // appui long → menu rapide
      const h = hitTest(this.els, p, H, {tol}); clearTimeout(this.lpTimer);
      if (h) this.lpTimer = setTimeout(() => this.longPress(h, ev.clientX, ev.clientY), 480);
    }
    const cur = this.selEl();
    if (cur && cur.type === "arrow" && (this.tool === "select" || this.tool === "pickLine" || t.place)){
      const S = M(cur.start, H), E = M(cur.end, H), C = elCenter(cur, H);
      const near = q => Math.hypot(p[0] - q[0], p[1] - q[1]) <= (pen ? .45 : .6);
      if (near(C)){ this.drag = {mode:"bend", started:false}; return; }
      if (near(S)){ this.drag = {mode:"end", which:"start", started:false}; return; }
      if (near(E)){ this.drag = {mode:"end", which:"end", started:false}; return; }
    }
    if (this.tool === "pickLine"){
      const h = hitTest(this.els, p, H, {only:["arrow", "free"], tol:pen ? .5 : .9});
      this.sel = h ? h.id : null; this.drag = h ? {mode:"move", last:p, started:false} : touch ? {mode:"scroll", y:ev.clientY} : null;
      this.renderSvg(); this.renderPanel(); return;
    }
    if (this.tool === "erase"){ const h = hitTest(this.els, p, H, {tol}); if (h){ this.snap(); this.els = this.els.filter(e => e !== h); if (this.sel === h.id) this.sel = null; this.renderSvg(); this.renderPanel(); this.changed(); } return; }
    if (t.arrow){ this.drag = {mode:"arrow", kind:t.arrow, curve:!!t.curve, pts:[p]}; return; }
    if (this.tool === "free"){ this.drag = {mode:"free", pts:[p], pr:[ev.pressure], pen}; return; }
    const h = hitTest(this.els, p, H, {tol});
    if (h && (this.tool === "select" || t.place || this.tool === "text")){
      this.sel = h.id; this.drag = {mode:"move", last:p, started:false};
      this.renderSvg(); this.renderPanel(); return;
    }
    if (this.tool === "select"){ this.sel = null; if (touch) this.drag = {mode:"scroll", y:ev.clientY}; this.renderSvg(); this.renderPanel(); return; }
    if (this.tool === "text"){
      this.snap(); const el = {type:"text", id:uid(), pos:this.N(p), text:"Texte"}; this.els = [...this.els, el]; this.sel = el.id;
      this.renderSvg(); this.renderPanel(); this.changed();
      const inp = $('[data-in="text"]', this.host); if (inp){ inp.focus(); inp.select(); }
      return;
    }
    if (t.place){
      this.snap(); const el = t.place(this.N(p), this.els); this.els = [...this.els, el]; this.sel = el.id;
      this.drag = {mode:"move", last:p, started:true}; this.renderSvg(); this.renderPanel(); this.changed();
    }
  }
  move(ev){
    const touch = ev.pointerType === "touch";
    if (touch){ if (!this.touches.has(ev.pointerId)) return; this.touches.set(ev.pointerId, ev.clientY); }
    const d = this.drag; if (!d) return;
    if (d.mode === "scroll2"){ const ys = [...this.touches.values()], y = ys.reduce((a, b) => a + b, 0) / ys.length; if (d.y != null) scrollPage(this.svg, d.y - y); d.y = y; return; }
    if (d.mode === "scroll"){ scrollPage(this.svg, d.y - ev.clientY); d.y = ev.clientY; return; }
    const p = this.toM(ev), H = this.H, e = this.selEl();
    if (d.mode === "penErase"){ this.eraseAt(p); return; }
    const pr = this.press;
    if (pr && Math.hypot(ev.clientX - pr.x, ev.clientY - pr.y) > 8){ clearTimeout(this.lpTimer); this.press = null; }
    if (d.mode === "arrow" || d.mode === "free"){ const l = d.pts[d.pts.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > .12){ d.pts.push(p); if (d.pr) d.pr.push(ev.pressure); this.renderSvg(); } return; }
    if (this.press && !this.press.mouse) return;                    // un doigt tremble toujours un peu : on attend qu'il bouge vraiment
    if (!e) return;
    if (!d.started){ this.snap(); d.started = true; }
    if (d.mode === "move"){ translateEl(e, (p[0] - d.last[0]) / CW, (p[1] - d.last[1]) / H); d.last = p; d.moved = true; }
    else if (d.mode === "bend"){ const S = M(e.start, H), E = M(e.end, H); e.control = this.N([2*p[0] - (S[0] + E[0]) / 2, 2*p[1] - (S[1] + E[1]) / 2]); d.moved = true; }
    else if (d.mode === "end"){ e[d.which] = this.N(p); d.moved = true; }
    this.renderSvg();
  }
  up(ev){
    if (ev && ev.pointerType === "touch"){ if (!this.touches.has(ev.pointerId)) return; this.touches.delete(ev.pointerId); }
    if (ev && ev.pointerType === "pen") this.penDown = false;
    clearTimeout(this.lpTimer); this.press = null;
    const d = this.drag;
    if (d && d.mode === "scroll2"){ if (!this.touches.size) this.drag = null; return; }
    this.drag = null; if (!d) return;
    if (d.mode === "scroll" || d.mode === "penErase") return;
    if (d.mode === "arrow"){
      const S = d.pts[0], E = d.pts[d.pts.length - 1];
      if (Math.hypot(E[0] - S[0], E[1] - S[1]) < .6){ this.renderSvg(); return; }
      this.snap();
      let C = d.curve ? curveCtrl(d.pts) : null;
      if (C){ const mid = [(S[0] + E[0]) / 2, (S[1] + E[1]) / 2]; if (Math.hypot(C[0] - mid[0], C[1] - mid[1]) < .3) C = null; }
      const el = {type:"arrow", id:uid(), start:this.N(S), end:this.N(E), kind:d.kind, control:C ? this.N(C) : null};
      this.els = [...this.els, el]; this.sel = el.id; this.renderSvg(); this.renderPanel(); this.changed(); return;
    }
    if (d.mode === "free"){
      if (d.pts.length < 2){ this.renderSvg(); return; }
      this.snap(); const step = Math.max(1, Math.floor(d.pts.length / 80));
      const pts = d.pts.filter((_, i) => i % step === 0 || i === d.pts.length - 1).map(p => this.N(p));
      const fe = {type:"free", id:uid(), points:pts};
      if (d.pen){ const ps = d.pr.filter(x => x > 0); if (ps.length) fe.w = r3(.05 + .14 * ps.reduce((a, b) => a + b, 0) / ps.length); }  // appuyer fort = trait épais
      this.els = [...this.els, fe]; this.renderSvg(); this.changed(); return;
    }
    if (d.moved) this.changed();
  }
  /* « Éditer en grand » : l'éditeur passe en plein écran. Sur une tablette Android, on bascule en paysage
     (sauf si l'utilisateur a bloqué la rotation en portrait), puis on revient au réglage choisi en sortant. */
  setFull(on){
    const ed = $(".ed", this.host); if (!ed) return;
    this.full = on; ed.classList.toggle("full", on); document.body.classList.toggle("edfull", on);
    const b = $('[data-act="full"]', this.host); if (b){ b.textContent = on ? "✓ Terminé" : "⛶ Éditer en grand"; b.classList.toggle("big-on", on); }
    if (window.CTA && isTablet() && (PREFS.orient || "auto") === "auto") try { CTA.setOrientation(on ? "landscape" : "auto"); } catch (e){}
    EDFULL = on ? this : null;
    this.closeMenu(); this.renderSvg();
  }
  cancelGesture(){                                                // un 2e doigt arrive : on annule ce que le 1er avait commencé
    clearTimeout(this.lpTimer); this.press = null;
    const d = this.drag; this.drag = null;
    if (d && d.started && d.moved && this.hist.length) this.restoreState(this.hist.pop()); else this.renderSvg();
  }
  eraseAt(p){
    const h = hitTest(this.els, p, this.H, {tol:.4}); if (!h) return;
    if (!this.drag || !this.drag.snapped){ this.snap(); if (this.drag) this.drag.snapped = true; }
    this.els = this.els.filter(e => e !== h); if (this.sel === h.id) this.sel = null; this.renderSvg(); this.renderPanel(); this.changed();
  }
  longPress(h, x, y){
    if (!this.press || !this.els.includes(h)) return;
    const d = this.drag; this.drag = null; this.press = null;
    if (d && d.started && d.moved && this.hist.length) this.restoreState(this.hist.pop());
    this.sel = h.id; this.renderSvg(); this.renderPanel();
    try { navigator.vibrate && navigator.vibrate(15); } catch (e){}  // petit « tac » pour sentir que le menu s'ouvre
    this.openMenu(h, x, y);
  }
  // ---------- menu rapide (appui long / clic droit / bouton du stylet) ----------
  menuHtml(e){
    const chip = (attr, v, label, on, dot) => `<button ${attr}="${v}"${on ? ' class="on"' : ""}>${dot ? `<i style="background:${dot}"></i>` : ""}${esc(label)}</button>`;
    const B = (act, label, cls = "", extra = "") => `<button data-m="${act}" ${extra}${cls ? ` class="${cls}"` : ""}>${label}</button>`;
    let title = "", h = "", btns = "";
    if (e.type === "player"){
      const staff = e.team === "COACH" || e.team === "ASSISTANT";
      title = staff ? (e.team === "COACH" ? "Entraîneur" : "Entraîneur adjoint") : `Joueur/joueuse ${e.label || ""}`;
      if (!staff){
        h += `<div class="cm-s">Action</div><div class="cm-c">${chip("data-action", "", "Aucune", !e.action)}${Object.entries(ACTIONS).map(([k, a]) => chip("data-action", k, a.label, e.action === k)).join("")}</div>`;
        h += `<div class="cm-s">Poste</div><div class="cm-c">${Object.entries(ROLES).map(([k, r]) => chip("data-role", k, r.label, e.role === k, r.color)).join("")}</div>`;
        h += `<div class="cm-s">Équipe</div><div class="cm-c">${["A", "B"].map(t => chip("data-team", t, TEAM_LABEL[t], e.team === t, TEAM[t])).join("")}</div>`;
        if (betaOn()) h += `<div class="cm-s">Geste β</div><div class="cm-c">${chip("data-geste", "", "Rond", !e.geste)}${Object.entries(GESTES).map(([k, g]) => chip("data-geste", k, g.label, e.geste === k)).join("")}</div>`;
        h += `<div class="cm-s">Numéro ou nom</div><input data-cmin="label" value="${esc(e.label)}" maxlength="3" inputmode="text">`;
        btns += B("tool", "➜ Déplacement", "", 'data-v="MOVE"') + B("tool", "➜ Trajet du ballon", "", 'data-v="BALLa"');
      }
    } else if (e.type === "equipment"){
      title = EQUIP[e.kind] || "Matériel";
      h += `<div class="cm-s">Tourner</div><div class="cm-c">${chip("data-rot", "-15", "⟲ 15°")}${chip("data-rot", "15", "⟳ 15°")}${chip("data-rot", "90", "↻ 90°")}</div>`;
    } else if (e.type === "arrow"){
      const arr = this.els.filter(x => x.type === "arrow"), k = arr.indexOf(e);
      title = e.kind === "BALL" ? "Trajet du ballon" : "Déplacement";
      h += `<div class="cm-s">Type</div><div class="cm-c">${chip("data-akind", "MOVE", "Déplacement", e.kind === "MOVE", "#222")}${chip("data-akind", "BALL", "Ballon", e.kind === "BALL", "#D32F2F")}</div>`;
      btns += B("act", "⇄ Inverser", "", 'data-v="flip"') + (e.control ? B("act", "Redresser", "", 'data-v="straight"') : "");
      if (arr.length > 1) h += `<div class="cm-s">Ordre dans l'animation : ${k + 1} / ${arr.length}</div><div class="cm-c">${k > 0 ? chip("data-mv", "aup", "◀ Plus tôt") : ""}${k < arr.length - 1 ? chip("data-mv", "adown", "Plus tard ▶") : ""}</div>`;
    } else if (e.type === "text"){
      title = "Texte"; h += `<input data-cmin="text" value="${esc(e.text)}" maxlength="30">`;
    } else title = "Dessin libre";
    btns += B("act", "Dupliquer", "", 'data-v="dup"') + B("act", "Supprimer", "dng", 'data-v="del"');
    const n = (btns.match(/<button/g) || []).length;
    if (n % 2) btns = btns.replace(/<button data-m="act" data-v="del" class="dng">/, '<button data-m="act" data-v="del" class="dng wide">');
    return `<div class="cm-h"><b>${esc(title)}</b><button class="cm-x" data-m="close" title="Fermer">✕</button></div>${h}<div class="cm-b">${btns}</div>`;
  }
  openMenu(e, x, y){
    this.closeMenu();
    const m = document.createElement("div"); m.className = "ctxm"; m.innerHTML = this.menuHtml(e);
    document.body.appendChild(m); this.menu = m; this.menuFor = e.id;
    const place = () => {                                           // à côté du doigt, sans sortir de l'écran
      const r = m.getBoundingClientRect(), W = innerWidth, Hh = innerHeight, g = 8;
      let left = x + 14, top = y + 14;
      if (left + r.width > W - g) left = Math.max(g, x - 14 - r.width);
      if (left < g) left = Math.max(g, (W - r.width) / 2);
      if (top + r.height > Hh - g) top = Math.max(g, y - 14 - r.height);
      m.style.left = left + "px"; m.style.top = top + "px";
    };
    place();
    m.addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      const el = this.els.find(z => z.id === this.menuFor); if (!el) return this.closeMenu();
      const ds = b.dataset;
      if (ds.m === "close") return this.closeMenu();
      if (ds.m === "act"){ this.closeMenu(); this.elAct(ds.v); return; }
      if (ds.m === "tool"){
        this.closeMenu(); this.tool = ds.v; const g = groups().findIndex(gr => gr[1].includes(ds.v)); if (g >= 0) this.group = g;
        this.renderTools(); this.renderPanel(); toast("Glissez depuis le joueur ou la joueuse jusqu'à l'arrivée."); return;
      }
      if (ds.rot != null){ this.elAct("rot", ds.rot); }
      else if (ds.mv){ this.elAct(ds.mv); }
      else if (ds.action != null) this.setProp("action", ds.action);
      else if (ds.role) this.setProp("role", ds.role);
      else if (ds.team) this.setProp("team", ds.team);
      else if (ds.geste != null) this.setProp("geste", ds.geste);
      else if (ds.akind) this.setProp("akind", ds.akind);
      else return;
      const again = this.els.find(z => z.id === this.menuFor);         // le menu reste ouvert : on peut régler plusieurs choses
      if (again && this.menu){ const sc = m.scrollTop; m.innerHTML = this.menuHtml(again); m.scrollTop = sc; place(); }
    });
    m.addEventListener("input", ev => { const t = ev.target; if (t.dataset.cmin) this.setProp(t.dataset.cmin, t.value, false); });
    m.addEventListener("keydown", ev => { if (ev.key === "Enter") this.closeMenu(); });
    this._outside = ev => { if (this.menu && !this.menu.contains(ev.target)) this.closeMenu(); };
    this._esc = ev => { if (ev.key === "Escape") this.closeMenu(); };
    setTimeout(() => { document.addEventListener("pointerdown", this._outside, true); document.addEventListener("keydown", this._esc); }, 0);
    addEventListener("hashchange", () => this.closeMenu(), {once:true});
  }
  closeMenu(){
    if (!this.menu) return;
    this.menu.remove(); this.menu = null;
    document.removeEventListener("pointerdown", this._outside, true); document.removeEventListener("keydown", this._esc);
  }
  // ---------- boutons ----------
  onClick(ev){
    const b = ev.target.closest("button"); if (!b || !this.host.contains(b)) return;
    if (b.dataset.grp != null){ this.group = +b.dataset.grp; const keys = groups()[this.group][1]; if (!keys.includes(this.tool)) this.tool = keys[0]; this.renderTools(); this.renderPanel(); return; }
    if (b.dataset.tool){ this.tool = b.dataset.tool; if (this.tool === "pickLine"){ const e = this.selEl(); if (e && e.type !== "arrow" && e.type !== "free"){ this.sel = null; this.renderSvg(); } } this.renderTools(); this.renderPanel(); return; }
    if (b.dataset.line){ this.sel = b.dataset.line; this.renderSvg(); this.renderPanel(); return; }
    if (b.dataset.ph != null){ if (this.anim) return; this.pi = +b.dataset.ph; this.sel = null; this.renderPhases(); this.renderSvg(); this.renderPanel(); return; }
    const act = b.dataset.act, e = this.selEl();
    if (act === "v3d"){ if (this.anim) this.stopAnim(); if (this.full) this.setFull(false); view3D(this.m.phases, this.m.view, this.pi); return; }
    if (this.readonly){ if (act === "anim") this.anim ? this.stopAnim() : this.startAnim(); return; }
    if (act === "undo") return this.undo();
    if (act === "redo") return this.redo();
    if (act === "anim") return this.anim ? this.stopAnim() : this.startAnim();
    if (this.anim) return;
    if (act === "addph"){ this.snap(); const src = this.m.phases[this.pi]; const ph = {id:uid(), name:"", elements:clone(src.elements)}; this.m.phases.splice(this.pi + 1, 0, ph); this.pi++; this.sel = null; this.renderPhases(); this.renderSvg(); this.renderPanel(); this.changed(); return; }
    if (act === "delph"){ confirmBox(`Supprimer la phase ${this.pi + 1} ?`, "Supprimer").then(ok => { if (!ok) return; this.snap(); this.m.phases.splice(this.pi, 1); this.pi = Math.max(0, this.pi - 1); this.sel = null; this.renderAll(); this.changed(); }); return; }
    if (act === "phleft" || act === "phright"){ const j = this.pi + (act === "phleft" ? -1 : 1); if (j < 0 || j >= this.m.phases.length) return; this.snap(); const a = this.m.phases; [a[this.pi], a[j]] = [a[j], a[this.pi]]; this.pi = j; this.renderPhases(); this.changed(); return; }
    if (act === "full"){ this.setFull(!this.full); return; }
    if (act === "pen"){ setPref("pen", !PREFS.pen); this.renderBar(); toast(PREFS.pen ? "Mode stylet : le stylet dessine, le doigt fait défiler la page." : "Mode stylet désactivé : le doigt dessine aussi."); return; }
    if (!e) return;
    this.elAct(act, b.dataset.v);
  }
  elAct(act, v){
    const e = this.selEl(); if (!e) return;
    if (act === "del"){ this.snap(); this.els = this.els.filter(x => x !== e); this.sel = null; }
    else if (act === "dup"){ this.snap(); const c = clone(e); c.id = uid(); translateEl(c, .8 / CW, .8 / this.H); this.els = [...this.els, c]; this.sel = c.id; }
    else if (act === "rot"){ this.snap(); e.rotation = ((e.rotation || 0) + +v + 360) % 360; }
    else if (act === "flip"){ this.snap(); [e.start, e.end] = [e.end, e.start]; }
    else if (act === "straight"){ this.snap(); e.control = null; }
    else if (act === "aup" || act === "adown"){
      const arr = this.els.filter(x => x.type === "arrow"), k = arr.indexOf(e), j = k + (act === "aup" ? -1 : 1);
      if (j < 0 || j >= arr.length) return;
      this.snap(); const list = this.els.slice(), a = list.indexOf(arr[k]), c = list.indexOf(arr[j]); [list[a], list[c]] = [list[c], list[a]]; this.els = list;
    }
    else return;
    this.renderSvg(); this.renderPanel(); this.changed();
  }
  onInput(ev, isChange){
    const t = ev.target, k = t.dataset.in || (t.dataset.act === "view" ? "view" : null); if (!k) return;
    if (k === "view"){ if (!isChange || t.value === this.m.view) return; this.snap(); for (const ph of this.m.phases) convertView(ph.elements, this.m.view, t.value); this.m.view = t.value; this.renderSvg(); this.changed(); return; }
    if (k === "phname"){ this.snap("phname" + this.pi); this.m.phases[this.pi].name = t.value; this.renderPhases(); const i = $('[data-in="phname"]', this.host); i.focus(); i.setSelectionRange(i.value.length, i.value.length); this.changed(); return; }
    this.setProp(k, t.value, isChange);
  }
  setProp(k, v, isChange = true){
    const e = this.selEl(); if (!e) return;
    const t = {value:v};
    if (k === "label"){ this.snap("label" + e.id); e.label = t.value.slice(0, 3); this.renderPanelKeepFocus(); }
    else if (k === "text"){ this.snap("text" + e.id); e.text = t.value.slice(0, 30); this.renderPanelKeepFocus(); }
    else if (k === "team"){ if (!isChange) return; this.snap(); e.team = t.value; if (e.team === "COACH" || e.team === "ASSISTANT"){ e.role = "NONE"; delete e.action; e.label = e.team === "COACH" ? "E" : "EA"; } this.renderPanel(); }
    else if (k === "role"){ if (!isChange) return; this.snap(); const old = ROLES[e.role].short; if (!e.label || e.label === old || /^\d+$/.test(e.label)) e.label = ROLES[t.value].short || e.label; e.role = t.value; this.renderPanel(); }
    else if (k === "akind"){ if (!isChange) return; this.snap(); e.kind = t.value; this.renderPanel(); }
    else if (k === "action"){ if (!isChange) return; this.snap(); if (t.value) e.action = t.value; else delete e.action; this.renderPanel(); }
    else if (k === "geste"){ if (!isChange) return; this.snap(); if (t.value) e.geste = t.value; else delete e.geste; this.renderPanel(); }

const PT = 0.3528; // 1 point = 0,3528 mm

function buildPdf(pages, label, wrap){
  const jsPDF = needPdf(); if (!jsPDF) return null;
  const orient = k => k === "exercise" ? "landscape" : "portrait";
  const real = new jsPDF({orientation:orient(pages[0].kind), unit:"mm", format:"a4"}), doc = wrap ? wrap(real, orient(pages[0].kind)) : real;
  pages.forEach((p, i) => {
    if (i) doc.addPage("a4", orient(p.kind));
    doc.setLineCap("round"); doc.setLineJoin("round");
    const lab = pages.length > 1 ? (label ? label + "  -  " : "") + `page ${i + 1} / ${pages.length}` : "";
    p.kind === "exercise" ? exercisePage(doc, p.item, lab) : warmupPage(doc, p.item, lab);

  return doc;
}
function sessionParts(s){
  const exs = s.exerciseIds.map(id => Store.get("exercise", id)).filter(x => x && x.deletedAt == null);
  const w0 = s.warmUpId ? Store.get("warmup", s.warmUpId) : null, wu = w0 && w0.deletedAt == null ? w0 : null;
  const tags = [];
  for (const e of exs) for (const t of e.tags) if (!tags.some(x => normTxt(x) === normTxt(t))) tags.push(t);

}

    const pages = [...(wu ? [{kind:"warmup", item:wu}] : []), ...exs.map(e => ({kind:"exercise", item:e}))];
    if (!pages.length){ toast("La séance est vide : ajoutez un échauffement ou des exercices."); return null; }

async function downloadPdf(kind, item, print){

    const {pages, name, label} = P;

    if (!doc) return;
    const blob = new Blob([doc.output("arraybuffer")], {type:"application/pdf"});

/* Imprimer : on fabrique le même PDF que le bouton PDF, puis on ouvre la fenêtre d'impression.
   - appli Android : le PDF part vers le service d'impression d'Android (imprimante Wi-Fi, « Enregistrer en PDF »…) ;
   - PC et navigateur : le PDF est chargé dans un cadre invisible, puis on demande l'impression de ce cadre. */
async function printPdf(blob, name){
  if (window.CTA && CTA.printPdf){ try { CTA.printPdf(name, await blobToB64(blob)); } catch (e){ toast("Impression impossible sur cet appareil."); } return; }
  if (window.CTA){ toast("Pour imprimer, mets à jour l'appli (version 1.8). En attendant : bouton PDF, puis Partager → Imprimer."); return saveFile(name, blob); }

  let done = false;
  const fallback = () => { if (done) return; done = true; toast("L'impression directe n'est pas possible ici : le PDF s'ouvre, imprime-le depuis la fenêtre du PDF."); saveFile(name, blob); };
  f.onload = () => setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); done = true; } catch (e){ fallback(); } }, 300);

}
