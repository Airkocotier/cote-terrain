/* ---------- Fiche papier -> fiche numérique (photo) ---------- */
const PHOTO_PROMPT = `${AI_RULES}

On te donne la ou les photos d'une fiche papier d'entraînement de volley. Transcris-la fidèlement pour l'appli « Côté Terrain » : recopie les textes (corrige seulement l'orthographe), n'invente pas de consignes absentes de la fiche, et laisse vide ce qui n'est pas sur la fiche.

Détermine d'abord ce que c'est :
- "exercise" : une fiche exercice (thème, objectifs, consignes, évolution, schémas…) ;
- "warmup" : un protocole d'échauffement (tableau de lignes : terrain / exercice / explication / réussite) ;
- "session" : une séance complète (un échauffement et/ou plusieurs exercices).

LES SCHÉMAS. Un terrain de volley mesure 9 m × 18 m, filet au milieu, lignes des 3 m à 3 m du filet. Donne les positions en mètres :
- terrain dessiné DEBOUT (filet horizontal) : "orientation":"vertical", x de 0 (gauche) à 13, y de 0 (haut) à 24 ; les lignes du terrain sont x=2 et x=11, y=3 (fond du haut) et y=21 (fond du bas), filet y=12, lignes des 3 m y=9 et y=15.
- terrain dessiné COUCHÉ (filet vertical) : "orientation":"horizontal", x de 0 (gauche) à 24, y de 0 (haut) à 13 ; lignes du terrain x=3 et x=21, y=2 et y=11, filet x=12, lignes des 3 m x=9 et x=15.
- demi-terrain seul : "court":"HALF". Debout : x 0 à 13, y 0 à 13.5, filet en HAUT à y=1.5, ligne des 3 m y=4.5, fond y=10.5. Couché : x 0 à 13.5 avec le filet à GAUCHE à x=1.5, ligne des 3 m x=4.5, fond x=10.5. Si la feuille montre le filet de l'autre côté, retourne le dessin.
- terrain entier : "court":"FULL".
Éléments possibles (place-les là où ils sont dessinés) :
- joueur : {"t":"player","x":6.5,"y":18,"team":"A","role":"NONE","label":"1","action":null}. action (facultatif) : SERVICE (au service), RELANCE (joue le ballon de relance), FAIT_RELANCE (envoie le ballon de relance, lanceuse), DEFENSE (en défense), ATTAQUE (attaque dans le jeu), FAIT_ATTAQUE (donne l'attaque sur une défenseuse), ou null. geste (facultatif, si le geste est dessiné) : PASSE (passe à 10 doigts), MANCHETTE, SERVICE, ou null. team : A (nos joueurs), B (adversaires), COACH (entraîneur, label "E"), ASSISTANT (adjoint, label "EA"). role : SETTER (passeur, P), OUTSIDE (poste 4, R4), OPPOSITE (poste 2 / pointu, Pt), MIDDLE (central, C), LIBERO (libéro, L), NONE sinon. label : 3 caractères maximum.
- matériel : {"t":"equipment","x":..,"y":..,"kind":"CONE","rotation":0}. kind : BALL (ballon), CONE (plot / coupelle), TARGET (cible / cerceau-cible), CART (chariot de ballons), LADDER (échelle de rythme), HURDLE (haie), HOOP (cerceau), SLAT (latte au sol), MEDBALL (médecine-ball), CHAIR (chaise), STAND (cible sur pied : panier en hauteur pour viser), SPIKER (perche d'attaque : ballon tenu en hauteur au bout d'une perche). rotation en degrés (0 = posé à l'horizontale sur le dessin).
- flèche : {"t":"arrow","x1":..,"y1":..,"x2":..,"y2":..,"kind":"BALL","bend":null}. kind : BALL (trajet du ballon, souvent trait plein) ou MOVE (déplacement d'un joueur, souvent pointillés). bend : null si la flèche est droite, sinon {"x":..,"y":..} = le point du MILIEU de la courbe.
- texte court écrit sur le schéma : {"t":"text","x":..,"y":..,"text":"zone 6"} (30 caractères maximum).
Plusieurs schémas d'un même exercice = plusieurs phases, dans l'ordre.

Catégories possibles (tags) : Échauffement, Service, Réception, Passe, Attaque, Contre, Défense, Relance, Jeu, Physique.
Catégories d'équipe (category) : M9/M11, M13, M15M, M15F, M18F, M18M, PNG, PNF, DEPM.

Réponds uniquement avec un objet JSON de cette forme (une seule des clés exercise / warmup / session est remplie) :
{"type":"exercise",
 "exercise":{"title":"","theme":"","tags":[],"objectives":"","runInstructions":"","evolution":"","executionInstructions":"","remarks":"","coachRole":"","durationMin":15,"playersCount":"","court":"FULL","orientation":"vertical","phases":[{"name":"","elements":[]}]},
 "warmup":{"date":"jj/mm/aaaa","category":"","theme":"","info":"","durationMin":15,"tags":["Échauffement"],"items":[{"name":"","explanation":"","success":"","court":"FULL","orientation":"horizontal","elements":[]}]},
 "session":{"title":"","date":"jj/mm/aaaa","notes":"","warmup":null,"exercises":[]}}
Dans "session", "warmup" a la forme de "warmup" ci-dessus (ou null) et "exercises" est une liste d'objets de la forme de "exercise".
Correspondance des champs d'un exercice : objectives = Objectifs ; runInstructions = Consignes de déroulement ; evolution = Évolution ; executionInstructions = Consignes de réalisation ; remarks = Remarques ; coachRole = Place et rôle de l'entraîneur. Garde les retours à la ligne avec \n.`;
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
// Convertit les éléments lus par Claude (en mètres) dans le format de l'appli
function aiElements(list, court, orientation){
  const view = court === "HALF" ? "HALF" : "FULL", H = CH(view), horiz = orientation === "horizontal";
  const P = (x, y) => { x = num(x); y = num(y); if (horiz){ const X = x, Y = y; x = CW - Y; y = X; } return {x:r3(clamp01(x / CW)), y:r3(clamp01(y / H))}; };
  const out = [];
  for (const e of Array.isArray(list) ? list : []){
    if (!e || typeof e !== "object") continue;
    if (e.t === "player"){ const o = {type:"player", id:uid(), pos:P(e.x, e.y), team:TEAM[e.team] ? e.team : "A", label:String(e.label ?? "").slice(0, 3), role:ROLES[e.role] ? e.role : "NONE"}; if (ACTIONS[e.action]) o.action = e.action; if (GESTES[e.geste]) o.geste = e.geste; out.push(o); }
    else if (e.t === "equipment" && EQUIP[e.kind]){
      // angle vu sur la feuille -> angle dans l'appli (l'échelle est dessinée debout, les autres objets couchés ; terrain couché = +90°)
      const r = num(e.rotation) + (e.kind === "LADDER" ? -90 : 0) + (horiz ? 90 : 0);
      out.push({type:"equipment", id:uid(), pos:P(e.x, e.y), kind:e.kind, rotation:(r % 360 + 360) % 360});
    }
    else if (e.t === "arrow"){
      const S = P(e.x1, e.y1), E = P(e.x2, e.y2); let control = null;
      if (e.bend && typeof e.bend === "object"){ const B = P(e.bend.x, e.bend.y); control = {x:r3(clamp01(2*B.x - (S.x + E.x) / 2)), y:r3(clamp01(2*B.y - (S.y + E.y) / 2))}; }
      out.push({type:"arrow", id:uid(), start:S, end:E, kind:e.kind === "MOVE" ? "MOVE" : "BALL", control});
    }
    else if (e.t === "text" && e.text) out.push({type:"text", id:uid(), pos:P(e.x, e.y), text:String(e.text).slice(0, 30)});
  }
  return out;
}

  if (Store.setup) b += `<div class="banner"><b>Installation pas terminée :</b> le mot de passe n'est pas encore réglé sur le serveur. Ouvrez <code>config.php</code> (ou la variable <code>FICHES_PASSWORD</code> sur Docker) et remplacez <code>CHANGE-MOI</code>, comme expliqué dans le guide.</div>`;
  if (Store.offline) b += `<div class="banner">Pas de connexion au serveur pour l'instant. Vous pouvez continuer : vos changements sont gardés sur cet appareil et partiront tout seuls au retour du réseau.</div>`;
  if (Store.slow) b += `<div class="banner">Les fiches enregistrées ne répondent pas encore. Patientez un peu : elles s'afficheront dès qu'elles arrivent.</div>`;
  if (needCopyReminder()){ const ref = +BKS.copyLast || 0;
    b += `<div class="banner bkrem"><span>💾 <b>Pense à mettre tes fiches à l'abri.</b> ${ref ? `Ta dernière copie envoyée hors de la tablette date du ${dtFR(ref)}.` : "Aucune copie n'a encore été envoyée hors de la tablette."} Si elle est perdue ou réinitialisée, c'est cette copie qui sauve tout.</span>
      <span class="bkb"><button class="btn pri" data-a="bk-send">↗ Envoyer une copie (Drive, mail…)</button><button class="btn" data-a="bk-later">Plus tard</button></span></div>`; }
  if (updNew()) b += `<div class="banner bkrem"><span>🆕 <b>La version ${esc(UPD.version)} de Côté Terrain est disponible.</b> Tu as la ${esc(APP.version)}. La mise à jour s'installe en une minute, et tes fiches sont gardées.</span>
      <span class="bkb"><button class="btn pri" data-a="upd-get">⬇ Mettre à jour</button><button class="btn" data-a="upd-later">Plus tard</button></span></div>`;
  if (webNeedsBackup()) b += `<div class="banner bkrem"><span>💾 <b>Pense à mettre tes fiches à l'abri.</b> ${WEB.lastExport ? `Ta dernière copie date du ${dtFR(WEB.lastExport)}.` : "Tu n'as encore fait aucune copie."} Elles sont gardées seulement sur cet appareil : une copie (Fichiers, iCloud, mail…) les protège s'il est perdu ou réinitialisé.</span>
      <span class="bkb"><button class="btn pri" data-a="web-export">💾 Tout exporter</button><button class="btn" data-a="web-later">Plus tard</button></span></div>`;
  if (Store.mode === "local") b += `<div class="banner">${Store.dbFailed ? "L'enregistrement en ligne n'a pas répondu. " : ""}Ici, les fiches sont gardées <b>dans ce navigateur seulement</b>. Pensez à « Tout exporter » de temps en temps pour avoir une copie.</div>`;
  return b;
}
function allCats(list){ const s = new Map(CATS.map(c => [normTxt(c[0]), c[0]])); for (const x of list) for (const t of x.tags) if (!s.has(normTxt(t))) s.set(normTxt(t), t); return [...s.values()]; }
function searchText(kind, x){
  if (kind === "session"){ const {exs, wu} = sessionParts(x); return normTxt([x.title, x.date, x.notes, ...(wu ? [wu.theme, wu.category] : []), ...exs.flatMap(e => [e.title, e.theme, ...e.tags])].join(" ")); }
  if (kind === "exercise") return normTxt([x.title, x.theme, x.objectives, x.runInstructions, x.evolution, x.executionInstructions, x.remarks, x.coachRole, x.playersCount, ...x.tags].join(" "));
  return normTxt([x.theme, x.date, x.category, x.info, ...x.tags, ...x.items.flatMap(i => [i.name, i.explanation, i.success])].join(" "));
}

function card(kind, x){
  if (kind === "session"){
    const {exs, wu, tags, dur} = sessionParts(x);
    const first = exs[0];
    const svg = first ? diagramSvg(allPhases(first)[0].elements, first.courtView, {w:first.courtView === "HALF" ? 92 : 68, h:first.courtView === "HALF" ? 96 : 126}) : `<div style="width:68px;height:96px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px">📋</div>`;
    return `<button class="card" data-a="open" data-k="se" data-v="${esc(x.id)}"><div class="th">${svg}</div><div style="min-width:0">
      <h3>${esc(seTitle(x))}</h3><div class="sub">${[x.date, (wu ? "échauffement + " : "") + exs.length + " exercice" + (exs.length > 1 ? "s" : ""), dur + " min"].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="badges">${tags.map(badgeHtml).join("")}</div><div class="made">${CREATED.session} ${dFR(x.createdAt)}</div></div></button>`;
  }
  if (kind === "exercise"){
    const ph = allPhases(x)[0];
    const svg = diagramSvg(ph.elements, x.courtView, {w:x.courtView === "HALF" ? 92 : 68, h:x.courtView === "HALF" ? 96 : 126});
    return `<button class="card" data-a="open" data-k="ex" data-v="${esc(x.id)}"><div class="th">${svg}</div><div style="min-width:0">
      <h3>${esc(exTitle(x))}</h3><div class="sub">${esc(x.title.trim() && x.theme.trim() ? x.theme : "")}${x.title.trim() && x.theme.trim() ? " · " : ""}${x.durationMin} min${allPhases(x).length > 1 ? " · " + allPhases(x).length + " phases" : ""}</div>
      <div class="badges">${x.tags.map(badgeHtml).join("")}</div><div class="made">${CREATED.exercise} ${dFR(x.createdAt)}</div></div></button>`;
  }
  const it = x.items.find(i => i.diagram.length) || x.items[0];
  const svg = it ? diagramSvg(it.diagram, it.courtView, {horizontal:true, w:it.courtView === "HALF" ? 96 : 150, h:it.courtView === "HALF" ? 92 : 81}) : "";
  return `<button class="card" data-a="open" data-k="wu" data-v="${esc(x.id)}"><div class="th">${svg}</div><div style="min-width:0">
    <h3>${esc(x.theme.trim() || "Protocole d'échauffement")}</h3><div class="sub">${[x.date, x.category, x.durationMin + " min", x.items.length + " lignes"].filter(Boolean).map(esc).join(" · ")}</div>
    <div class="badges">${x.tags.map(badgeHtml).join("")}</div><div class="made">${CREATED.warmup} ${dFR(x.createdAt)}</div></div></button>`;
}

/* Partage Android : dans Instagram, YouTube ou le navigateur, « Partager » → Côté Terrain.
   L'appli reçoit le lien et ouvre « Ajouter une ressource » déjà rempli (type deviné d'après l'adresse). */
function guessResource(text, subject){
  const url = ((text || "").match(/https?:\/\/[^\s]+/) || [""])[0];
  const host = (() => { try { return new URL(url).hostname.replace(/^www\.|^m\./, ""); } catch (e){ return ""; } })();
  const t = /instagram\.com/.test(host) ? "insta" : /youtube\.com|youtu\.be|tiktok\.com|vimeo\.com|dailymotion/.test(host) ? "video" : /\.pdf($|\?)/i.test(url) ? "doc" : "site";
  const ig = t === "insta" && (url.match(/instagram\.com\/([A-Za-z0-9._]+)\/?(\?|$)/) || [])[1];
  const rest = (text || "").replace(url, "").replace(/\s+/g, " ").trim();
  const title = (subject || "").trim() || (ig ? "@" + ig : "") || rest.slice(0, 100) || host || "Nouvelle ressource";
  const src = t === "insta" ? "Instagram" : /youtu/.test(host) ? "YouTube" : host;
  return {url, t, title, src, desc:subject && rest ? rest.slice(0, 300) : "", lang:"FR"};
}

  setTimeout(() => resourceDialog(null, pre), 250);
};

const BK_KEY = "coteTerrain.bk", BK_KEEP = 8, DAY = 864e5;

function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return s.length + "-" + (h >>> 0).toString(36); }

function autoBackup(force){
  if (!canAutoBk() || Store.mode !== "db") return null;
  const every = PREFS.abEvery || "day";
  if (every === "off" && !force) return null;
  const now = Date.now();
  if (!force && now - (+BKS.last || 0) < (every === "week" ? 7 : 1) * DAY - 36e5) return null;
  const snap = bkSnapshot();
  if (!BKS.since) bkSet({since:now});

  if (!force && snap.stamp === BKS.stamp){ bkSet({checked:now, seen:snap.stamp}); return null; }   // rien de nouveau
  let r;
  try { r = String(CTA.backup(`cote-terrain-auto-${localDay()}.json`, snap.txt, BK_KEEP)); } catch (e){ r = "err:" + (e && e.message || e); }

async function sendCopy(){

  for (const e of d.exercises || []) add("exercise", normEx(e));
  for (const w of d.warmUps || []) add("warmup", normWu(w));
  for (const x of d.sessions || []) add("session", normSe(x));
  for (const x of d.teams || []) add("team", normTeam(x));
  for (const x of d.matches || []) add("match", normMatch(x));

const UPD_URL = "https://airkocotier.github.io/cote-terrain/version.json", UPD_KEY = "fichesVolley.update";

    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(UPD_URL + "?t=" + Date.now(), {cache:"no-store", signal:ctl.signal}); if (!r.ok) return;
    const j = await r.json(); if (!j || !/^\d+(\.\d+)*$/.test(j.version || "")) return;

    if (updNew()) render();

  } catch (e){ return null; }
}

async function updCheckNow(){
  if (window.COTE_TERRAIN_PC && window.COTE_TERRAIN_PC.store){ toast("Version Microsoft Store : les mises à jour arrivent toutes seules par le Store (Microsoft Store > Bibliothèque)."); return; }
  if (window.CTA){ toast("Version Android : les mises à jour arrivent par Google Play (Play Store > ta photo > Gérer les applis)."); return; }
  if (updCan()){
    toast("Recherche d'une nouvelle version…");
    const v = await checkUpdate(true);
    if (!v){ toast("Impossible de vérifier pour le moment (pas de connexion à internet ?)."); return; }
    if (verCmp(v, APP.version) > 0){ updSet({later:0}); render(); updInstall(); return; }
    toast(`✅ Tu as la dernière version (${APP.version}).`); return;
  }
  // version web : on regarde la version en ligne, et on recharge si elle est plus récente
  try {
    toast("Recherche d'une nouvelle version…");
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) reg.update().catch(() => {});
    const t = await (await fetch("index.html?t=" + Date.now(), {cache:"no-store"})).text(), m = /version:"([\d.]+)"/.exec(t);

    toast(`✅ Tu as la dernière version (${APP.version}).`);
  } catch (e){ toast("Impossible de vérifier pour le moment (pas de connexion à internet ?)."); }

    if (e.target.id === "crf"){ st.files = [...e.target.files].slice(0, AI.images.maxCount); if (e.target.files.length > AI.images.maxCount) toast(`${AI.images.maxCount} photos au maximum : les premières sont gardées.`); showFiles(); }
  });
  d.el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.s){ keep(); st[b.dataset.s] = Math.max(1, Math.min(b.dataset.s === "ex" ? 12 : 8, st[b.dataset.s] + +b.dataset.d)); draw(); return; }
    if (b.dataset.x === "no") return d.close();
    if (b.dataset.x === "guide"){ d.close(); return seanceGuide(); }
    if (b.dataset.x === "go"){
      keep();
      if (st.choice === "ready"){ d.close(); return readyDialog(); }
      if (st.choice === "photo"){ if (!st.files.length){ toast("Choisissez d'abord une photo de la fiche."); return; } d.close(); photoDialog(st.files); return; }
      d.close(); createItems(st);
    }
  });
  draw();
}
function createItems(st){
  if (st.choice === "exercise"){ const x = newExercise(); Store.put("exercise", x, true); location.hash = "#/ex/" + encodeURIComponent(x.id); return; }
  const date = isoToFr(st.date || "") || todayFR();
  const mdl = st.model && wuModels().find(m => m.id === st.model);
  let w = newWarmup(); w.date = date; w.items = Array.from({length:st.wu}, (_, i) => normItem({name:i === 0 ? "Échauffement" : ""}));
  if (mdl && st.choice !== "exercise"){ w = wuFromModel(mdl); w.date = date; }
  if (st.choice === "warmup"){ Store.put("warmup", w, true); location.hash = "#/wu/" + encodeURIComponent(w.id); return; }
  const title = (st.title || "").trim() || "Séance du " + date;
  const exs = Array.from({length:st.ex}, (_, i) => { const e = newExercise(); e.title = `Exercice ${i + 1} – ${title}`; return e; });
  const withWu = st.choice !== "session_nowu";                       // « séance sans échauffement » : pas de protocole créé
  const se = normSe({id:uid(), title, date, day:epochDay(date), warmUpId:withWu ? w.id : null, exerciseIds:exs.map(e => e.id)});
  if (withWu) Store.put("warmup", w, true);
  exs.forEach(e => Store.put("exercise", e, true)); Store.put("session", se, true);
  UI.tab = "se"; location.hash = "#/se/" + encodeURIComponent(se.id);
}

const B45 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";

// PC : ouvre la porte (10 min, un échange), affiche le QR code, puis attend le téléphone.
async function lanPC(mode, pay){
  let r;
  try { await loadQrGen(); r = await pcApi("lan_start", {mode, payload:pay || null}); } catch (e){ toast("La passerelle n'a pas pu s'ouvrir : " + (e.message || e)); return; }
  if (r.error){ dialog(`<h3 style="margin-top:0">📡 Passerelle Wi-Fi</h3><p>Impossible d'ouvrir la passerelle : ${esc(r.error)}.</p><div class="acts"><button class="btn pri" onclick="this.closest('.ov').remove()">OK</button></div>`); return; }
  const code = `CTW1:${mode}:${r.port}:${r.token}:${r.ips.join("+")}`;
  let t = null, over = false;
  const stop = () => { if (over) return; over = true; clearInterval(t); pcApi("lan_stop", {}).catch(() => {}); };
  const d = dialog(`<h3 style="margin-top:0">📡 ${mode === "R" ? "Recevoir du téléphone" : "Envoyer au téléphone"}</h3>
    <div class="br-qr">${qrSvg(code)}</div>
    <p class="br-st">⏳ En attente du téléphone…</p>
    <p class="br-note" style="text-align:center">Sur le téléphone (même Wi-Fi) : ☰ Menu → 🌉 Passerelle → <b>Par le Wi-Fi</b> → <b>Scanner le QR code du PC</b>.</p>
    <div class="acts"><button class="btn" data-l="close">Annuler</button></div>`, {big:true, onClose:stop});
  const st = $(".br-st", d.el);
  d.el.addEventListener("click", e => { if (e.target.closest('[data-l="close"]')){ stop(); d.close(); } });
  t = setInterval(async () => {
    if (!document.contains(d.el)){ stop(); return; }
    let s; try { s = await pcApi("lan_status"); } catch (e){ return; }
    if (s.data){ over = true; clearInterval(t); d.close(); importData(s.data); return; }
    if (s.done && mode === "S"){ over = true; clearInterval(t); st.textContent = "✅ Fiches envoyées au téléphone !"; $(".acts .btn", d.el).textContent = "Fermer"; return; }
    if (!s.active){ over = true; clearInterval(t); st.textContent = "⌛ Temps écoulé : recommence quand tu veux."; return; }
    st.textContent = `⏳ En attente du téléphone… (encore ${Math.max(1, Math.ceil(s.left / 60))} min)`;
  }, 1500);
}
// Téléphone (appli Android) : après avoir scanné le QR code du PC.
function lanPhone(text){
  const m = /^CTW1:([RS]):(\d+):([0-9A-F]{24}):([0-9.+]+)$/.exec(text || "");
  if (!m){ toast("QR code de passerelle illisible."); return; }
  if (!hasLan()){ toast("Ce QR code se scanne avec l'appli Android de " + APP.name + " (à jour)."); return; }
  const [, mode, port, tok, ips] = m, call = (meth, url, body) => { const r = String(CTA.lan(meth, url, body || "")); const i = r.indexOf("\n"); return {code:+r.slice(0, i), body:r.slice(i + 1)}; };
  const fail = msg => dialog(`<h3 style="margin-top:0">📡 Passerelle Wi-Fi</h3><p>${msg}</p><div class="acts"><button class="btn pri" onclick="this.closest('.ov').remove()">OK</button></div>`);
  toast("Connexion au PC…");
  setTimeout(() => {
    let base = null;
    for (const ip of ips.split("+")){ const r = call("GET", `http://${ip}:${port}/ct/hello?k=${tok}`); if (r.code === 200){ base = `http://${ip}:${port}`; break; } }
    if (!base) return fail("Le PC ne répond pas. Vérifie que le téléphone et le PC sont sur <b>le même Wi-Fi</b>, et que Windows a autorisé " + esc(APP.name) + " sur les réseaux privés. Puis recommence (le QR code ne sert qu'une fois).");
    if (mode === "S"){
      const r = call("GET", `${base}/ct/get?k=${tok}`);
      if (r.code !== 200) return fail("Le PC a refusé l'envoi (code expiré ?). Recommence depuis le PC.");
      try { importData(JSON.parse(r.body)); } catch (e){ fail("Le paquet reçu est illisible."); }
      return;
    }
    transferSend(null, {label:"Envoyer au PC", icon:ICON.up, sub:"Par le Wi-Fi, directement", run:(pay, n) => {
      toast("Envoi au PC…");
      setTimeout(() => { const r = call("POST", `${base}/ct/send?k=${tok}`, JSON.stringify(pay));
        if (r.code === 200) toast(`✅ ${n} fiche${n > 1 ? "s" : ""} envoyée${n > 1 ? "s" : ""} au PC.`); else fail("L'envoi n'a pas abouti (code " + r.code + "). Recommence depuis le PC."); }, 50); }});
  }, 60);
}

async function sendFile(name, text){
  if (window.CTA && CTA.share){ const r = CTA.share(name, "application/json", await blobToB64(new Blob([text], {type:"application/json"}))); if (r) toast(r); return; }
  try { const f = new File([text], name, {type:"application/json"});
    if (!window.COTE_TERRAIN_PC && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; } } catch (e){ if (e && e.name === "AbortError") return; }
  if (await saveFile(name, text)) toast(window.COTE_TERRAIN_PC ? "Fichier enregistré dans Téléchargements : envoie-le à l'autre appareil (mail, WhatsApp, clé USB…)." : "Fichier enregistré : envoie-le à l'autre appareil, puis Transférer → Recevoir → Ouvrir un fichier.");

async function liveAction(a, b){
  const L = LIVE; if (!L.key) return;
  if (a === "live-toggle") return L.running ? livePause() : liveStart();
  if (a === "live-reset"){ liveReset(L.i); return drawLive(); }
  if (a === "live-add"){
    const d = +b.dataset.v;
    if (L.running) L.endAt += d; else L.rem = Math.max(1000, L.rem + d);
    if (liveLeft() > 0){ L.alarmed = false; clearInterval(L.autoT); L.autoT = null; $("#ltimer").classList.remove("ring"); $("#lalarm").classList.add("hide"); $("#lalarm").innerHTML = ""; }
    if (liveLeft() > 60000) L.warned = false;
    return liveTick();
  }
  if (a === "live-go"){ liveReset(+b.dataset.v); return drawLive(); }
  if (a === "live-prev" && L.i > 0){ liveReset(L.i - 1); return drawLive(); }
  if (a === "live-next" && L.i < L.steps.length - 1){ liveReset(L.i + 1); drawLive(); return window.scrollTo(0, 0); }
  if (a === "live-noauto"){ clearInterval(L.autoT); L.autoT = null; const s = $("#lauto"); s && s.remove(); b.remove(); return; }
  if (a === "live-opts") return liveOptions();
  if (a === "live-mute"){ setPref("liveMute", !PREFS.liveMute); if (PREFS.liveMute) try { speechSynthesis.cancel(); } catch (e){} toast(PREFS.liveMute ? "Annonces vocales coupées." : "Annonces vocales actives."); return drawLive(); }
  if (a === "live-cnt") return liveCountTap(b);
  if (a === "live-show") return showPlayers(L.steps[L.i].item);
  if (a === "live-rate"){
    const id = b.dataset.id, r = L.results[id] || (L.results[id] = {itemId:id, kind:b.dataset.k, rating:"NONE", note:""});
    r.rating = r.rating === b.dataset.v ? "NONE" : b.dataset.v;
    b.parentNode.querySelectorAll("[data-a='live-rate']").forEach(x => x.classList.toggle("on", x.dataset.v === r.rating));
    return;
  }
  if (a === "live-quit"){
    const started = L.running || L.i > 0 || Object.keys(L.results).length || liveLeft() < stepDur(L.steps[L.i] || {item:{durationMin:1}});
    if (started && !(await confirmBox("Quitter le mode direct ? Le chrono s'arrête et le bilan n'est pas enregistré.", "Quitter"))) return;
    const to = L.back; liveStop(true); location.hash = to; return;
  }
  if (a === "live-finish"){
    livePause();
    if (L.kind !== "session"){ const to = L.back; liveStop(true); location.hash = to; toast("Bravo, c'est terminé !"); return; }
    const res = Object.values(L.results).filter(r => r.rating !== "NONE" || r.note.trim());
    const mins = Math.round((Date.now() - L.startedAt) / 60000);
    const d = dialog(`<h3>Terminer la séance</h3><p style="margin:0 0 8px;color:var(--muted)">${mins} min de séance · ${res.length} élément(s) apprécié(s). Le bilan s'ajoute à l'historique de la séance.</p>
      <label class="f"><span>Notes sur la séance (facultatif)</span><textarea id="lnotes" rows="3" placeholder="Ambiance, absentes, ce qu'il faudra revoir…"></textarea></label>
      <div class="acts" style="flex-wrap:wrap"><button class="btn" data-x="back">Continuer la séance</button><button class="btn dng" data-x="no">Quitter sans enregistrer</button><button class="btn pri" data-x="save">Enregistrer le bilan</button></div>`);
    d.el.addEventListener("click", e => {
      const x = e.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "back") return d.close();
      if (x.dataset.x === "save"){
        Store.extras.runs = [...(Store.extras.runs || []), {id:uid(), sessionId:L.item.id, startedAt:L.startedAt, endedAt:Date.now(), results:res.map(r => ({itemId:r.itemId, kind:r.kind, rating:r.rating, note:r.note.trim()})), notes:$("#lnotes", d.el).value.trim()}];
        Store.saveExtras(); toast("Bilan enregistré dans l'historique de la séance.");
      }
      d.close(); const to = L.back; liveStop(true); location.hash = to;
    });
  }
}

// ---------- actions (un seul écouteur pour toute la page) ----------
/* =====================================================================
   MATCHS : équipes (prénom, numéro, poste), composition, saisie point par point, bilan.
   On n'enregistre que la liste des événements d'un set (points, changements, corrections).
   Le score, l'équipe au service, la serveuse et la rotation sont recalculés en « rejouant »
   cette liste : « Annuler » consiste simplement à retirer le dernier événement.
   ===================================================================== */
const POSTE_KEYS = ["SETTER", "OUTSIDE", "OPPOSITE", "MIDDLE", "LIBERO", "NONE"];
const posteLabel = k => k === "NONE" ? "Polyvalent" : (ROLES[k] || ROLES.NONE).label;
const posteShort = k => (ROLES[k] && ROLES[k].short) || "";
const posteColor = k => (ROLES[k] && ROLES[k].color) || "#546E7A";
// Les façons de marquer ou de perdre un point. who : "srv" = la serveuse (automatique), "pick" = on choisit la joueuse, "opt" = facultatif, null = personne.
const MPT = {
  ACE:{w:"us", l:"Ace", s:"Service gagnant", who:"srv"},
  ATT:{w:"us", l:"Attaque gagnante", who:"pick"},
  BLK:{w:"us", l:"Contre gagnant", who:"pick"},
  FSA:{w:"us", l:"Faute de service adverse", who:null},
  FA:{w:"us", l:"Autre faute adverse", s:"Dehors, filet, 4 touches…", who:null},
  FS:{w:"them", l:"Faute de service", who:"srv"},
  REC:{w:"them", l:"Réception ratée", s:"Ace subi, ballon injouable", who:"pick"},
  AE:{w:"them", l:"Attaque dehors / filet", who:"pick"},
  AB:{w:"them", l:"Attaque contrée", who:"pick"},
  FJ:{w:"them", l:"Faute de jeu", s:"Filet, pied, 2 touches…", who:"pick"},
  PA:{w:"them", l:"Point adverse", s:"Leur attaque passe, défense ratée", who:"opt"}
};
const PT_US = ["ACE", "ATT", "BLK", "FSA", "FA"], PT_THEM = ["FS", "REC", "AE", "AB", "FJ", "PA"];
// Ce qu'il faut travailler quand on perd des points de cette façon (noms des catégories des fiches)
const WORK = [{k:"Service", t:["FS"], cat:"Service", txt:"fautes de service"}, {k:"Réception", t:["REC"], cat:"Réception", txt:"réceptions ratées"},
  {k:"Attaque", t:["AE", "AB"], cat:"Attaque", txt:"attaques dehors, au filet ou contrées"}, {k:"Fautes de jeu", t:["FJ"], cat:"Jeu", txt:"fautes de jeu (filet, pied, double…)"},
  {k:"Défense", t:["PA"], cat:"Défense", txt:"points adverses non défendus"}];
const MFMT = {win:3, pts:25, tb:15};

function normTeam(x){
  x = x || {};
  return {id:x.id || uid(), name:str(x.name), cat:str(x.cat), players:(Array.isArray(x.players) ? x.players : []).map(p => ({id:p.id || uid(), first:str(p.first), num:str(p.num), pos:POSTE_KEYS.includes(p.pos) ? p.pos : "NONE"})),
    createdAt:x.createdAt || Date.now(), updatedAt:x.updatedAt || Date.now()};
}
function normMatch(x){
  x = x || {};
  const f = x.fmt || {};
  return {id:x.id || uid(), teamId:str(x.teamId), teamName:str(x.teamName), date:str(x.date), opp:str(x.opp), home:x.home !== false, comp:str(x.comp),
    fmt:{win:f.win === 2 ? 2 : 3, pts:+f.pts || 25, tb:+f.tb || 15},
    roster:(Array.isArray(x.roster) ? x.roster : []).map(p => ({id:p.id, first:str(p.first), num:str(p.num), pos:p.pos || "NONE"})),
    sets:(Array.isArray(x.sets) ? x.sets : []).map(S => ({lineup:Array.isArray(S.lineup) ? S.lineup.slice(0, 6) : [], lib:S.lib || null, weServe:!!S.weServe, ev:Array.isArray(S.ev) ? S.ev : []})),
    done:!!x.done, notes:str(x.notes), createdAt:x.createdAt || Date.now(), updatedAt:x.updatedAt || Date.now()};
}
const teamTitle = t => t.name.trim() || "Équipe sans nom";
const matchTitle = m => `${m.teamName || "Nous"} – ${m.opp || "Adversaire"}`;
const pById = (m, id) => m.roster.find(p => p.id === id);
const pName = (m, id, long) => { const p = pById(m, id); if (!p) return "—"; return (p.num ? "n°" + p.num + " " : "") + (p.first || (long ? "joueur/joueuse" : "")); };

// ---------- rejouer un set ----------
function replaySet(m, si){
  const S = m.sets[si], court = S.lineup.slice(), st = {us:0, them:0, srv:S.weServe ? "us" : "them", court, pts:[], to:{us:0, them:0}};
  for (const e of S.ev){
    if (e.k === "pt"){
      st.pts.push({t:e.t, w:MPT[e.t] ? MPT[e.t].w : e.w, p:e.p || null, srvSide:st.srv, server:st.srv === "us" ? court[0] : null, posI:court[0], before:[st.us, st.them]});
      const w = MPT[e.t] ? MPT[e.t].w : e.w; st[w]++;
      if (w === "us" && st.srv === "them") court.push(court.shift());          // on reprend le service : on tourne d'un cran
      st.srv = w;
    } else if (e.k === "sub"){ const i = court.indexOf(e.o); if (i >= 0) court[i] = e.i; }
    else if (e.k === "fix"){ if (e.rot) court.push(court.shift()); if (e.swap) st.srv = st.srv === "us" ? "them" : "us"; }
    else if (e.k === "to") st.to[e.side]++;
  }
  return st;
}
const setTarget = (m, si) => si === m.fmt.win * 2 - 2 ? m.fmt.tb : m.fmt.pts;
function setWinner(m, si, st){ st = st || replaySet(m, si); const t = setTarget(m, si); return Math.max(st.us, st.them) >= t && Math.abs(st.us - st.them) >= 2 ? (st.us > st.them ? "us" : "them") : null; }
function setsWon(m){ const r = {us:0, them:0}; m.sets.forEach((S, i) => { const w = setWinner(m, i); if (w) r[w]++; }); return r; }
const matchOver = m => { const s = setsWon(m); return s.us >= m.fmt.win || s.them >= m.fmt.win; };

// ---------- statistiques ----------
function matchStats(m){
  const blank = () => ({srv:0, ACE:0, FS:0, REC:0, ATT:0, AE:0, AB:0, BLK:0, FJ:0, PA:0});
  const players = new Map(m.roster.map(p => [p.id, blank()])), team = {...blank(), FSA:0, FA:0, won:0, lost:0, ourSrv:0, ourSrvWon:0, oppSrv:0, oppSrvWon:0};
  const rot = new Map(), sets = [];
  m.sets.forEach((S, si) => {
    const st = replaySet(m, si), ss = {...blank(), FSA:0, FA:0, us:st.us, them:st.them, run:0, to:st.to};
    let run = 0;
    for (const x of st.pts){
      team[x.t] = (team[x.t] || 0) + 1; ss[x.t] = (ss[x.t] || 0) + 1;
      x.w === "us" ? team.won++ : team.lost++;
      if (x.srvSide === "us"){ team.ourSrv++; team.srv++; ss.srv++; if (x.w === "us") team.ourSrvWon++; const ps = players.get(x.server); if (ps) ps.srv++; }
      else { team.oppSrv++; if (x.w === "us") team.oppSrvWon++; }
      const pid = x.p || (MPT[x.t] && MPT[x.t].who === "srv" ? x.server : null), ps = pid && players.get(pid);
      if (ps && x.t in ps) ps[x.t]++;
      const r = rot.get(x.posI) || {won:0, lost:0}; x.w === "us" ? r.won++ : r.lost++; rot.set(x.posI, r);
      if (x.w === "them"){ run++; ss.run = Math.max(ss.run, run); } else run = 0;
    }
    sets.push(ss);
  });
  const plus = s => s.ACE + s.ATT + s.BLK, minus = s => s.FS + s.REC + s.AE + s.AB + s.FJ + s.PA;
  return {team, players, rot, sets, plus, minus};
}
function matchInsights(m, S){
  const T = S.team, lost = T.lost || 1, out = [];
  const work = WORK.map(w => ({...w, n:w.t.reduce((a, t) => a + (T[t] || 0), 0)})).filter(w => w.n).sort((a, b) => b.n - a.n);
  const who = w => { const l = [...S.players].map(([id, s]) => [id, w.t.reduce((a, t) => a + (s[t] || 0), 0)]).filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 2);
    return l.length ? " — surtout " + l.map(([id, n]) => `${pName(m, id, true)} (${n})`).join(", ") : ""; };
  const direct = T.FS + T.AE + T.AB + T.FJ;
  if (T.lost) out.push({t:"info", h:`${direct} points perdus sur nos fautes directes`, p:`soit ${Math.round(100 * direct / lost)} % des ${T.lost} points perdus (service, attaque, fautes de jeu). Les ${T.REC + T.PA} autres viennent de leur service ou de leur attaque.`});
  for (const w of work.slice(0, 3)) if (w.n >= 3 || w.n / lost >= .15) out.push({t:"work", h:`À travailler : ${w.k}`, p:`${w.n} ${w.txt} (${Math.round(100 * w.n / lost)} % des points perdus)${who(w)}.`, cat:w.cat});
  if (T.oppSrv) out.push({t:"info", h:`Sur leur service, on marque ${Math.round(100 * T.oppSrvWon / T.oppSrv)} % des points`, p:"C'est le « side-out » : notre réception, notre passe et notre attaque. Au-dessus de 55 %, c'est solide."});
  if (T.ourSrv) out.push({t:"info", h:`Sur notre service, on marque ${Math.round(100 * T.ourSrvWon / T.ourSrv)} % des points`, p:`${T.ACE} ace${T.ACE > 1 ? "s" : ""}, ${T.FS} faute${T.FS > 1 ? "s" : ""} de service sur ${T.ourSrv} services (${T.ourSrv ? Math.round(100 * (1 - T.FS / T.ourSrv)) : 0} % dans le terrain).`});
  const good = [["ACE", "aces"], ["ATT", "attaques gagnantes"], ["BLK", "contres gagnants"]].filter(([k]) => T[k]).map(([k, l]) => `${T[k]} ${l}`);
  if (good.length) out.push({t:"good", h:"Nos points marqués", p:good.join(", ") + ` · ${T.FSA + T.FA} points offerts par l'adversaire.`});
  return out;
}

// ---------- composition d'un set ----------
const POS_GRID = [[3, "IV"], [2, "III"], [1, "II"], [4, "V"], [5, "VI"], [0, "I"]];   // ordre d'affichage : avant (filet) puis arrière
function renderLineup(m, si){
  const editing = si < m.sets.length, prev = m.sets[Math.min(si, m.sets.length) - (editing ? 0 : 1)];
  const start = editing ? m.sets[si] : {lineup:prev ? prev.lineup.slice() : m.roster.filter(p => p.pos !== "LIBERO").slice(0, 6).map(p => p.id), lib:prev ? prev.lib : (m.roster.find(p => p.pos === "LIBERO") || {}).id || null, weServe:prev ? !prev.weServe : true};

// repère des 75 % de réussite (comptage du mode Direct)
function countZone(c){
  const n = c.ok + c.ko; if (n < 8) return "";
  const p = pctOf(c);
  if (p >= 85) return `<div class="lc-zone easy">😎 ${p} % : c'est facile. Passe à l'évolution suivante.</div>`;
  if (p < 65) return `<div class="lc-zone hard">😓 ${p} % : c'est dur. Simplifie un peu pour revenir vers 75 %.</div>`;
  return `<div class="lc-zone ok">👍 ${p} % : bonne difficulté (le repère : environ 75 % de réussite).</div>`;
}

const TOUR_NAMES = {seance:"Construire une séance complète (avec un exemple)", lib:"La bibliothèque", ex:"Une fiche d'exercice et l'éditeur de schéma", live:"Le mode Direct", match:"La saisie d'un match"};
let TOUR = null;
function tourDone(name){ const d = {...(PREFS.toursDone || {})}; d[name] = true; setPref("toursDone", d); }
function startTour(name){
  endTour();
  if (name === "ex" && $(".page.mt-fiche")) $('.mtabs [data-v="both"]').click();   // la visite montre aussi l'éditeur de schéma
  const steps = (TOURS[name] || []).filter(([sel]) => tourTarget(sel));
  if (!steps.length) return;
  const ov = document.createElement("div"); ov.className = "tour";
  ov.innerHTML = `<div class="tour-hole"></div><div class="tour-b"><b class="tour-t"></b><p></p><div class="tour-n"><span></span><button class="btn" data-t="skip">Passer</button><button class="btn" data-t="prev">◀</button><button class="btn pri" data-t="next"></button></div></div>`;
  document.body.appendChild(ov);
  TOUR = {name, steps, i:0, ov};
  ov.addEventListener("click", e => { const t = e.target.closest("[data-t]"); if (!t) return; const a = t.dataset.t;
    if (a === "skip"){ tourDone(name); return endTour(); }
    if (a === "prev" && TOUR.i > 0){ TOUR.i--; return showStep(); }
    if (a === "next"){ if (TOUR.i < TOUR.steps.length - 1){ TOUR.i++; return showStep(); } tourDone(name); endTour(); toast("Fin de la visite. Tu peux la relancer avec 🎓 (À propos ou Options)."); } });
  showStep();
}
function tourTarget(sel){
  const el = $(sel); if (!el) return null;
  if (el.closest(".lmenu .tmore-l")) return $("[data-lmenu]");
  if (el.closest(".tmore-l")) return $("[data-tmore]");          // bouton rangé dans le menu ⋯
  return el.getClientRects().length ? el : null;
}
function showStep(){
  const {steps, i, ov} = TOUR, [sel, title, txt] = steps[i], el = tourTarget(sel);
  $(".tour-t", ov).textContent = title; $(".tour-b p", ov).textContent = txt;
  $(".tour-n span", ov).textContent = `${i + 1} / ${steps.length}`;
  $('[data-t="prev"]', ov).disabled = i === 0; $('[data-t="next"]', ov).textContent = i === steps.length - 1 ? "Terminer ✓" : "Suivant ▶";
  const hole = $(".tour-hole", ov), b = $(".tour-b", ov);
  if (!el){ hole.style.display = "none"; b.style.cssText = "left:50%;top:40%;transform:translate(-50%,-50%)"; return; }
  el.scrollIntoView({block:"center", behavior:"instant"});
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect(), pad = 6, W = innerWidth, H = innerHeight;
    const top = Math.max(4, r.top - pad), h = Math.min(r.height + 2 * pad, H - top - 4);
    Object.assign(hole.style, {display:"block", left:Math.max(4, r.left - pad) + "px", top:top + "px", width:Math.min(r.width + 2 * pad, W - 8) + "px", height:h + "px"});
    const bw = Math.min(340, W - 20); b.style.cssText = `width:${bw}px;left:${Math.min(Math.max(10, r.left + r.width / 2 - bw / 2), W - bw - 10)}px;`;
    const bh = b.offsetHeight;
    if (top + h + 12 + bh < H) b.style.top = (top + h + 12) + "px";
    else if (top - 12 - bh > 0) b.style.top = (top - 12 - bh) + "px";
    else b.style.top = Math.max(10, H - bh - 10) + "px";
  });
}
function endTour(){ if (TOUR){ TOUR.ov.remove(); TOUR = null; } }
// première fois qu'on ouvre un écran : visite automatique si l'utilisateur a accepté le tuto
function autoTour(name){
  if (!PREFS.tourAuto || (PREFS.toursDone || {})[name] || TOUR || navigator.webdriver) return;
  setTimeout(() => { if (!TOUR && !$$("#layer .ov").length) startTour(name); }, 700);
}

    <div class="acts"><button class="btn" data-x="reset">Tout revoir depuis le début</button><button class="btn pri" data-x="close">Fermer</button></div>`);

    if (where[a] && where[a]()) return startTour(a);

    const p = {...(PREFS.toursDone || {})}; delete p[a]; setPref("toursDone", p); setPref("tourAuto", true);
    toast(a === "ex" ? "Ouvre un exercice : la visite démarre." : a === "live" ? "Lance le ⏱ Direct d'un exercice : la visite démarre." : "Ouvre la saisie d'un match : la visite démarre.");
  });
}

// ---------- 🐞 signaler un problème ----------
// L'adresse qui reçoit les signalements se règle dans ⚙️ Options (gardée sur l'appareil) ; APP.contact sert d'adresse par défaut.
const bugMail = () => (PREFS.bugMail || APP.contact || "").trim();
// Petit journal des erreurs, gardé seulement sur cet appareil : il est joint au message si l'utilisateur envoie un signalement.
const ERRLOG = "coteTerrain.errlog";
function logErr(msg){ try { const L = JSON.parse(localStorage.getItem(ERRLOG) || "[]"); L.push(new Date().toLocaleString("fr-FR") + " · " + String(msg).slice(0, 220)); localStorage.setItem(ERRLOG, JSON.stringify(L.slice(-12))); } catch (e){} }
addEventListener("error", e => logErr((e.message || "erreur") + (e.filename ? " (" + String(e.filename).split("/").pop() + ":" + e.lineno + ")" : "")));
addEventListener("unhandledrejection", e => logErr("promesse : " + (e.reason && (e.reason.message || e.reason))));
function bugDialog(){
  const screenName = (() => { const h = location.hash.replace(/^#\/?/, "").split("/")[0]; return {"":"bibliothèque", ex:"fiche exercice", wu:"échauffement", se:"séance", direct:"mode Direct", matchs:"liste des matchs", match:"match", equipes:"équipes", equipe:"équipe", ressources:"ressources", corbeille:"corbeille"}[h] || h; })();
  const [kind, item] = currentItem();
  const d = dialog(`<h3>🐞 Signaler un problème</h3>
    <div class="seg bug-k"><button class="on" data-k="Bug">🐞 Un bug</button><button data-k="Idée">💡 Une idée</button><button data-k="Question">❓ Une question</button></div>
    <label class="f" style="margin-top:10px"><span>Que s'est-il passé ?</span><textarea id="bugt" rows="5" placeholder="Ex. : sur la tablette, dans le mode Direct, j'ai appuyé sur « Suivant » et le chrono ne s'est pas remis à zéro."></textarea></label>
    ${bugMail() ? "" : `<label class="f"><span>Adresse qui reçoit les signalements</span><input id="bugm" type="email" placeholder="adresse@exemple.fr"></label>`}
    ${item ? `<p class="m-hint" style="margin-top:0">Si le problème concerne cette fiche, <button class="btn" data-x="json" style="padding:3px 9px">📎 enregistre-la (.json)</button> et joins-la au mail.</p>` : ""}
    <p class="m-hint">Le message part de ton appli mail${bugMail() ? ", vers " + esc(bugMail()) : ""}. Il contient aussi la version, l'appareil et les dernières erreurs de l'appli (pas tes fiches). Rien n'est envoyé tant que tu n'appuies pas sur Envoyer.</p>
    <div class="acts" style="flex-wrap:wrap"><button class="btn" data-x="no">Annuler</button><button class="btn" data-x="copy">Copier le message</button><button class="btn pri" data-x="mail">✉️ Préparer le mail</button></div>`);
  let k = "Bug";
  const build = () => {
    const txt = $("#bugt", d.el).value.trim(), errs = (() => { try { return JSON.parse(localStorage.getItem(ERRLOG) || "[]"); } catch (e){ return []; } })();
    const resume = txt.replace(/\s+/g, " ").slice(0, 60) + (txt.length > 60 ? "…" : "");
    const subject = `[Côté Terrain] ${k} · v${APP.version} ${APP.edition.replace("version ", "")}${resume ? " · " + resume : ""}`;
    const body = [`${k === "Bug" ? "Ce qui s'est passé" : k} :`, txt || "(à décrire)", "",
      "— Infos techniques (ajoutées par l'appli) —",
      `Appli : ${APP.name} ${APP.version} (${APP.edition})`, `Écran : ${screenName}${item ? " · « " + (kind === "exercise" ? exTitle(item) : kind === "warmup" ? wuTitle(item) : seTitle(item)) + " »" : ""}`,
      `Appareil : ${navigator.userAgent.slice(0, 160)}`, `Taille : ${innerWidth}×${innerHeight} (zoom ${PREFS.zoom || 1})`, `Fiches : ${Store.list("exercise").length} exercices, ${Store.list("session").length} séances · stockage ${Store.mode}`,
      `Dernières erreurs : ${errs.length ? "\n" + errs.slice(-6).join("\n") : "aucune"}`].join("\n");
    return {subject, body};
  };
  d.el.addEventListener("click", async e => {
    const kb = e.target.closest("[data-k]"); if (kb){ k = kb.dataset.k; $$(".bug-k button", d.el).forEach(b => b.classList.toggle("on", b === kb)); return; }
    const x = e.target.closest("[data-x]"); if (!x) return; const a = x.dataset.x;
    if (a === "no") return d.close();
    if (a === "json") return saveFile(fileName(kind === "exercise" ? exTitle(item) : kind === "warmup" ? wuTitle(item) : seTitle(item), "json"), jsonOf(kind, item));
    const m = $("#bugm", d.el); if (m && m.value.trim()) setPref("bugMail", m.value.trim());
    const to = bugMail();
    const {subject, body} = build();
    if (a === "copy"){
      try { await navigator.clipboard.writeText(`${to ? "À : " + to + "\n" : ""}Sujet : ${subject}\n\n${body}`); toast("Message copié : colle-le dans un mail" + (to ? " à " + to : "") + "."); }
      catch (err){ toast("Copie impossible ici."); }
      return;
    }
    if (!to){ toast("Indique d'abord l'adresse qui reçoit les signalements."); if (m) m.focus(); return; }
    let b = body; const mk = () => `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(b)}`;
    while (mk().length > 1900 && b.length > 200) b = b.slice(0, b.length - 150);       // les liens mail trop longs ne s'ouvrent pas partout
    const url = mk();
    try { if (window.CTA) location.href = url; else { const w = window.open(url, "_blank"); if (!w) location.href = url; } } catch (err){}
    toast("Ton appli mail s'ouvre avec le message prêt. Si rien ne s'ouvre : « Copier le message ».");
    setTimeout(() => d.close(), 400);
  });
}

  const d = dialog(`<h3>📋 Exercices tout prêts</h3><p class="m-hint" style="margin-top:0">Des fiches complètes (schémas, consignes, évolutions). « Ajouter » en fait une copie dans ta bibliothèque, que tu peux ensuite modifier.</p>
    <div class="rdy">${READY_EX.map(r => { const e = r.build(); const ph = allPhases(e)[0];
      return `<div class="rdy-c"><div class="th">${diagramSvg(ph.elements, e.courtView, {w:e.courtView === "HALF" ? 84 : 62, h:e.courtView === "HALF" ? 88 : 116})}</div>
        <div class="rdy-t"><b>${esc(r.title)}</b><small>${esc([e.theme, procLabel(e.procedure), e.durationMin + " min", allPhases(e).length + " étapes"].join(" · "))}</small><span>${esc(r.note)}</span></div>
        <button class="btn pri" data-r="${r.id}">＋ Ajouter</button></div>`; }).join("")}</div>
    <div class="acts"><button class="btn" data-x="no">Fermer</button></div>`, {big:true});
  d.el.addEventListener("click", e => {
    const b = e.target.closest("[data-r]");
    if (b){ const r = READY_EX.find(x => x.id === b.dataset.r), ex = r.build(); Store.put("exercise", ex, true); d.close(); toast(`« ${ex.title} » ajouté à ta bibliothèque.`); onAdd ? onAdd(ex) : (location.hash = "#/ex/" + encodeURIComponent(ex.id)); return; }

/* ---------- ROTATIONS 5-1 (1.10) ----------
   Les 6 rotations (P1 = passeur en zone 1, etc.), en RÉCEPTION et au SERVICE, avec l'animation des déplacements.
   Placements en réception : options « classiques » de Gold Medal Squared (réception à 3 : les deux R4 et le libéro,
   pointu caché, passeur qui part à la frappe du service). Règle de position : règles officielles FIVB 2025-2028
   (7.4, 7.5 ; libéro 19.3.1.3). L'appli vérifie elle-même chaque placement en réception.
   Repères du demi-terrain (mètres) : filet y = 1.5, ligne des 3 m y = 4.5, fond y = 10.5, côtés x = 2 et x = 11. */
const ROT_ROLES = {P:{n:"Passeur", s:"P", r:"SETTER"}, Pt:{n:"Pointu", s:"Pt", r:"OPPOSITE"}, R4a:{n:"R4 n°1", s:"R4", r:"OUTSIDE"}, R4b:{n:"R4 n°2", s:"R4", r:"OUTSIDE"},
  Ca:{n:"Central n°1", s:"C", r:"MIDDLE"}, Cb:{n:"Central n°2", s:"C", r:"MIDDLE"}, L:{n:"Libéro", s:"L", r:"LIBERO"}};
const ROT_BASE = ["P", "R4a", "Cb", "Pt", "R4b", "Ca"];        // en P1 : zones 1 à 6 (le libéro remplace le central arrière)
const ROT_ORDER = [1, 6, 5, 4, 3, 2];                          // l'ordre du jeu : après P1 vient P6, puis P5…
function rotZones(n){            // zone -> rôle, pour la rotation Pn (passeur en zone n)
  const k = ((1 - n) % 6 + 6) % 6, z = {};
  ROT_BASE.forEach((r, i) => { z[((i - k) % 6 + 6) % 6 + 1] = r; });
  return z;
}
const DEF5 = [3.4, 8.4], DEF6 = [6.5, 9.0], T_SET = [6.5, 2.4], POST4 = [3.3, 2.6], POSTC = [5.0, 2.6], POST2 = [9.7, 2.6], PT_3M = [9.4, 5.6];   // PT_3M : pointu arrière, attaque derrière les 3 m en zone 1
// Réception : placement au moment du service adverse (rec), puis après (aft). Clés = rôles ; L = libéro.
const ROT_REC = {
  1:{rec:{Pt:[2.5,2.3], Cb:[3.45,2.3], R4a:[4.1,6.8], R4b:[6.2,7.6], L:[8.8,7.6], P:[10.5,8.8]},
     txt:"Le pointu (zone 4) ne réceptionne pas : il reste au filet, collé à la ligne de gauche, à côté du central. Réception à 3 : R4 n°1 (il recule à gauche), R4 n°2 (au centre), libéro (à droite). Le passeur se cache au fond à droite, derrière le libéro."},
  6:{rec:{R4b:[3.6,6.8], Pt:[9.2,2.3], Cb:[10.5,2.3], L:[6.3,7.8], P:[8.7,5.2], R4a:[9.7,7.4]},
     txt:"Le passeur (zone 6) monte derrière le pointu, entre le libéro et le R4 n°1. Réception à 3 : R4 n°2 (zone 5), libéro (zone 6), R4 n°1 (zone 1). Le pointu se place au filet devant le passeur, le central à sa droite."},
  5:{rec:{Ca:[2.4,2.3], R4b:[3.8,6.8], Pt:[9.8,2.3], P:[3.0,4.4], R4a:[6.5,7.8], L:[9.5,7.6]},
     txt:"Le passeur attend à gauche, vers la ligne des 3 m, derrière le central : c'est son plus long trajet. Réception à 3 : R4 n°2 (il recule en zone 5), R4 n°1 (zone 6), libéro (zone 1). Le central se colle à la ligne de gauche, au filet ; le pointu reste au filet à droite."},
  4:{rec:{P:[2.4,2.2], Ca:[3.6,2.3], R4b:[9.4,7.0], R4a:[3.6,7.4], L:[6.5,7.6], Pt:[10.5,9.6]},
     txt:"Passeur avant, en zone 4, collé au central à gauche du filet. Réception à 3 : R4 n°1 (zone 5), libéro (zone 6), R4 n°2 (il recule en zone 1). Le pointu se cache au fond à droite."},
  3:{rec:{R4a:[3.4,6.8], P:[7.6,2.2], Ca:[9.8,2.3], L:[5.8,7.6], Pt:[7.8,9.8], R4b:[9.5,7.4]},
     txt:"Passeur avant, au centre du filet. Réception à 3 : R4 n°1 (il recule en zone 5), libéro (zone 6), R4 n°2 (zone 1). Le pointu se cache au fond, entre le libéro et le R4 n°2."},
  2:{rec:{Cb:[2.3,2.3], R4a:[3.8,6.8], P:[9.0,2.2], Pt:[2.8,9.8], R4b:[6.4,7.8], L:[9.5,7.6]},
     txt:"Passeur avant, à droite du filet. Réception à 3 : R4 n°1 (il recule en zone 5), R4 n°2 (zone 6), libéro (zone 1). Le pointu se cache au fond à gauche ; le central reste au filet, collé à la ligne de gauche."}
};
const ZONE_XY = {4:[3.5,3.0], 3:[6.5,3.0], 2:[9.5,3.0], 5:[3.5,8.0], 6:[6.5,8.0], 1:[9.5,11.6]};
const roleOnCourt = (z, n, serve) => {   // le libéro remplace le central arrière… sauf quand ce central est au service (le libéro ne sert pas)
  const r = z[n];
  if (r && r[0] === "C" && [5, 6, 1].includes(n) && !(serve && n === 1)) return "L";
  return r;
};
function rotLayout(n, sit){
  const z = rotZones(n), out = {phase1:{}, phase2:{}, zoneOf:{}, txt:""};
  for (let k = 1; k <= 6; k++){ const r = roleOnCourt(z, k, sit === "srv"); out.zoneOf[r] = k; }
  if (sit === "rec"){
    // après la réception, chacun à son poste : devant, R4 en 4, central à côté du passeur (au centre), pointu en 2 ;
    // derrière, libéro en 5, R4 en 6, pointu arrière derrière les 3 m en zone 1
    const d = ROT_REC[n], front = r => [2, 3, 4].includes(out.zoneOf[r]);
    out.phase1 = {...d.rec};
    for (const r of Object.keys(d.rec)) out.phase2[r] = r === "P" ? T_SET : front(r) ? (r.startsWith("R4") ? POST4 : r[0] === "C" ? POSTC : POST2) : r === "Pt" ? PT_3M : r === "L" ? DEF5 : DEF6;
    const nm = r => ROTX && ROTX[r] ? rotName(r) : "le " + ROT_ROLES[r].n;
    const r4f = ["R4a", "R4b"].find(front), r4b = ["R4a", "R4b"].find(r => !front(r));
    out.txt = d.txt + ` Après la réception, chacun à son poste : le passeur au centre du filet, le central à côté de lui, ${nm(r4f)} en 4, ${front("Pt") ? "le pointu en 2" : "le pointu attaque derrière les 3 mètres, en zone 1"} ; derrière, le libéro en 5 et ${nm(r4b)} en 6.`;
  } else {
    const front = [z[4], z[3], z[2]], back = [5, 6, 1].map(k => roleOnCourt(z, k, true));
    for (let k = 1; k <= 6; k++) out.phase1[roleOnCourt(z, k, true)] = ZONE_XY[k];
    for (const r of front) out.phase2[r] = r.startsWith("R4") ? [3.3,3.0] : r[0] === "C" ? [6.5,3.0] : [9.7,3.0];
    for (const r of back) out.phase2[r] = (r === "P" || r === "Pt") ? [9.6,8.4] : (r === "L" || r[0] === "C") ? [3.4,8.4] : [6.5,9.0];
    const srv = roleOnCourt(z, 1, true), cServe = srv[0] === "C";
    out.txt = `Au service : ${rotName(srv)} sert depuis la zone 1${cServe ? " (le libéro ne peut pas servir : le central reste sur le terrain pour son service, puis défend en zone 5, à la place du libéro)" : ""}. Les autres sont dans leur zone. Juste après la frappe, chacun file à son poste de défense : devant, R4 à gauche, central au centre, ${front.includes("P") ? "passeur" : "pointu"} à droite ; derrière, ${cServe ? "le central" : "le libéro"} en 5, le R4 en 6, ${back.includes("P") ? "le passeur" : "le pointu"} en 1.`;
  }
  return out;
}
// la règle de position (équipe en réception) : avant plus près du filet que son arrière ; de gauche à droite dans chaque ligne
function rotCheck(n){
  const L = rotLayout(n, "rec"), byZ = {};
  for (const [r, k] of Object.entries(L.zoneOf)) byZ[k] = {r, p:L.phase1[r]};
  const nm = k => `zone ${k} (${rotName(byZ[k].r)})`, out = [];
  for (const [f, b] of [[4, 5], [3, 6], [2, 1]]) out.push({ok:byZ[f].p[1] < byZ[b].p[1], t:`${nm(f)} plus près du filet que ${nm(b)}`});
  for (const [a, b] of [[4, 3], [3, 2], [5, 6], [6, 1]]) out.push({ok:byZ[a].p[0] < byZ[b].p[0], t:`${nm(a)} à gauche de ${nm(b)}`});
  return out;
}
let ROTX = null;                     // noms des joueurs (équipe choisie), rempli à l'affichage
const rotName = r => { const p = ROTX && ROTX[r]; return p ? `${p.first || "n°" + p.num} (${ROT_ROLES[r].n})` : ROT_ROLES[r].n; };
function rotPrefs(){ return Object.assign({sit:"rec", n:1, team:"", maps:{}}, PREFS.rot || {}); }
function rotTeamMap(t){
  const m = Object.assign({}, (rotPrefs().maps || {})[t.id] || {}), used = new Set(Object.values(m));
  const pick = (pos, role) => { if (m[role] && t.players.some(p => p.id === m[role])) return; const p = t.players.find(x => x.pos === pos && !used.has(x.id)); if (p){ m[role] = p.id; used.add(p.id); } };
  pick("SETTER", "P"); pick("OPPOSITE", "Pt"); pick("OUTSIDE", "R4a"); pick("OUTSIDE", "R4b"); pick("MIDDLE", "Ca"); pick("MIDDLE", "Cb"); pick("LIBERO", "L");
  return m;
}
function rotPhases(n, sit){
  const L = rotLayout(n, sit), H = CH("HALF"), at = ([x, y]) => ({x:+(x / CW).toFixed(4), y:+(y / H).toFixed(4)});
  const els = ph => {
    const out = [], tx = [];
    for (const [r, xy] of Object.entries(ph)){
      const p = ROTX && ROTX[r], lab = p ? (p.num || (p.first || "?").slice(0, 2)) : ROT_ROLES[r].s;
      out.push({type:"player", id:"rot-" + r, pos:at(xy), team:"A", label:String(lab).slice(0, 3), role:ROT_ROLES[r].r});
      const t = p ? p.first : /^(R4|C)[ab]$/.test(r) ? (r.endsWith("a") ? "n°1" : "n°2") : "";
      if (t) tx.push({r, t, x:xy[0], y:xy[1] + .95, w:textW(t) * .55 + .45});
    }
    // deux prénoms qui se chevauchent (joueurs collés) : on les écarte sur le côté
    for (let k = 0; k < 4; k++) for (const A of tx) for (const B of tx){
      if (A === B || A.x > B.x || Math.abs(A.y - B.y) > .75) continue;
      const need = (A.w + B.w) / 2 - (B.x - A.x);
      if (need > 0){ A.x -= need / 2 + .02; B.x += need / 2 + .02; }
    }
    for (const T of tx) out.push({type:"text", id:"rot-" + T.r + "~t", pos:at([Math.max(1.2, Math.min(11.8, T.x)), T.y]), text:T.t});
    return out;
  };
  const mv = (r, a, b) => ({type:"arrow", id:"rot-m-" + r, start:at(a), end:at(b), kind:"MOVE", control:null});
  const far = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) > .5;
  const e1 = els(L.phase1), e2 = els(L.phase2), arrows = [];
  const moves = Object.keys(L.phase2).filter(r => far(L.phase1[r], L.phase2[r]));
  if (sit === "rec"){
    if (moves.includes("P")) arrows.push(mv("P", L.phase1.P, L.phase2.P));
    arrows.push({type:"arrow", id:"rot-b1", start:at([L.phase1.L[0] < 6.5 ? 8.5 : 4.5, .2]), end:at(L.phase1.L), kind:"BALL", control:null});
    arrows.push({type:"arrow", id:"rot-b2", start:at(L.phase1.L), end:at(T_SET), kind:"BALL", control:null});
    for (const r of moves) if (r !== "P") arrows.push(mv(r, L.phase1[r], L.phase2[r]));
  } else {
    const srv = Object.keys(L.zoneOf).find(r => L.zoneOf[r] === 1);
    arrows.push({type:"arrow", id:"rot-b1", start:at([L.phase1[srv][0], L.phase1[srv][1] - .5]), end:at([5.5, .2]), kind:"BALL", control:null});
    for (const r of moves) arrows.push(mv(r, L.phase1[r], L.phase2[r]));
  }
  const lab = sit === "rec" ? ["placement en réception", "après la frappe du service"] : ["au service", "après le service : défense"];
  return [{id:"rot1", name:`P${n} – ${lab[0]}`, elements:e1}, {id:"rot2", name:`P${n} – ${lab[1]}`, elements:e2.concat(arrows)}];
}
const ROT_SOURCES = [
  ["Règles officielles de volleyball 2025-2028 (FIVB) : 7.4 positions, 7.5 faute de position, 19.3.1.3 le libéro ne sert pas", "https://www.fivb.com/wp-content/uploads/2025/06/FIVB-Volleyball_Rules2025_2028-FR-v04.pdf"],
  ["Gold Medal Squared : réception rotation par rotation (options classiques)", "https://goldmedalsquared.com/post/volleyball-rotations/"],
  ["Volleyball Vault : les postes de base en défense", "https://volleyballvault.com/volleyball-base-positions/"]
];

  const teams = Store.list("team").filter(t => !t.deletedAt), team = teams.find(t => t.id === R.team) || null;

  const next = ROT_ORDER[(ROT_ORDER.indexOf(n) + 1) % 6];
  $("#app").innerHTML = banners() + `<div class="rot">
    <div class="rot-side">
      <div class="panel">
        <div class="seg rot-sit"><button class="${sit === "rec" ? "on" : ""}" data-a="rot-sit" data-v="rec">🙌 En réception</button><button class="${sit === "srv" ? "on" : ""}" data-a="rot-sit" data-v="srv">🏐 Au service</button></div>
        <div class="rot-ps">${[1, 2, 3, 4, 5, 6].map(k => `<button class="rot-p${k === n ? " on" : ""}" data-a="rot-p" data-v="${k}" title="Passeur en zone ${k}">P${k}</button>`).join("")}</div>
        <button class="btn rot-next" data-a="rot-p" data-v="${next}">Rotation suivante (ordre du jeu) : P${next} ▶</button>
        <p class="rot-hint">P1 = passeur en zone 1, P2 = passeur en zone 2… Dans un match, après P1 vient P6, puis P5, P4, P3, P2.</p>
      </div>
      <div class="panel">
        <label class="rot-rs"><span>Noms</span><select data-rot="team"><option value="">Sans noms (P, Pt, R4, C, L)</option>${teams.map(t => `<option value="${esc(t.id)}"${team && team.id === t.id ? " selected" : ""}>${esc(t.name || "Équipe sans nom")}</option>`).join("")}</select></label>
        ${team ? `<div class="rot-roles">${roleSel}</div><p class="rot-hint">Rempli tout seul d'après les postes de l'équipe (Matchs → Équipes) ; à corriger ici si besoin.</p>` : teams.length ? "" : `<p class="rot-hint">Pour afficher les prénoms, crée ton équipe dans 📊 Matchs → Équipes (prénom, numéro, poste).</p>`}
      </div>
    </div>
    <div class="rot-main">
      <div class="panel rot-court"><div id="rothost"></div></div>
      <div class="panel rot-txt">

        ${chk ? `<h3>Règle de position ${ok ? "✅ respectée" : "❌ à corriger"}</h3><ul class="rot-chk">${chk.map(c => `<li class="${c.ok ? "ok" : "ko"}">${c.ok ? "✔" : "✖"} ${esc(c.t)}</li>`).join("")}</ul>
          <p class="rot-hint">Vérifiée au moment de la frappe du service adverse. Ensuite, chacun peut aller où il veut. Le libéro remplace le central qui est à l'arrière.</p>`
        : `<p class="rot-hint">Depuis les règles FIVB 2025-2028 (en France à partir de la saison 2025-2026), l'équipe au service peut se placer librement au moment du service ; seule l'équipe en réception doit respecter l'ordre de rotation. Ici, chacun est montré dans sa zone pour bien voir la rotation.</p>`}
        <details class="rot-src"><summary>Sources</summary><ul>${ROT_SOURCES.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul></details>
      </div>

    const P = rotPrefs();
    if (sel.dataset.rot === "team") P.team = sel.value;
    else if (team){ const m = rotTeamMap(team); if (sel.value) for (const k of Object.keys(m)) if (m[k] === sel.value) delete m[k]; sel.value ? m[sel.dataset.rotrole] = sel.value : delete m[sel.dataset.rotrole]; P.maps = Object.assign({}, P.maps, {[team.id]:m}); }

function rotAsExercise(sit){

    objectives:sit === "rec" ? "Connaître sa place en réception dans les 6 rotations, sans faute de position, et rejoindre vite son poste d'attaque." : "Connaître sa place au service dans les 6 rotations et rejoindre vite son poste de défense.",

}
/* ---------- MODE LECTURE (1.9) ----------
   Le but de l'appli : ne plus imprimer. On ouvre donc une fiche en LECTURE (gros schéma animable, textes lisibles,
   rien à modifier par erreur), et une séance en DIAPOS qu'on fait glisser : présentation, échauffement, puis un
   exercice par diapo. Le bouton ✏️ Modifier repasse en édition. */
const VIEW_KEY = {exercise:"vx", warmup:"vw", session:"vs"}, EDIT_KEY = {exercise:"ex", warmup:"wu", session:"se"};
const openInView = () => (PREFS.openMode || "view") === "view";
const fmtTxt = s => esc(String(s || "").trim()).replace(/\n/g, "<br>");
const rdBlock = (label, s) => String(s || "").trim() ? `<section class="rd-s"><h3>${esc(label)}</h3><div class="rd-t">${fmtTxt(s)}</div></section>` : "";
function rdChips(bits){ bits = bits.filter(b => b && String(b[1]).trim()); return bits.length ? `<div class="rd-chips">${bits.map(([i, t]) => `<span>${i} ${esc(t)}</span>`).join("")}</div>` : ""; }
function exReadHtml(ex, {title = true, editBtn = false} = {}){
  const txt = EX_FIELDS.map(([k, l]) => rdBlock(l, ex[k])).join("");
  return `<article class="rd">
    <header class="rd-h">${title ? `<h2>${esc(exTitle(ex))}</h2>` : ""}
      ${rdChips([["🎯", ex.theme], ["⏱", ex.durationMin ? ex.durationMin + " min" : ""], ["👥", ex.playersCount], ["🧭", procLabel(ex.procedure)]])}

  {
    const data = Array.isArray(d) ? {exercises:d} : d.exercises || d.warmUps || d.sessions ? d : d.title != null ? {exercises:[d]} : null;
    if (!data) throw new Error("format");
    let ne = 0, nw = 0;
    for (const x of data.exercises || []){ const n = normEx(x); n.deletedAt = null; Store.putRaw("exercise", n); ne++; }
    for (const x of data.warmUps || []){ const n = normWu(x); n.deletedAt = null; Store.putRaw("warmup", n); nw++; }
    let ns = 0;
    for (const x of data.sessions || []){ const n = normSe(x); n.deletedAt = null; Store.putRaw("session", n); ns++; }
    for (const x of data.teams || []) Store.putRaw("team", normTeam(x));
    for (const x of data.matches || []) Store.putRaw("match", normMatch(x));
    let extra = false;
    for (const n of ["runs", "cycles", "counts", "wuModels"]) if (Array.isArray(data[n]) && data[n].length){ const m = new Map((Store.extras[n] || []).map(x => [x.id, x])); for (const x of data[n]) m.set(x.id, x); Store.extras[n] = [...m.values()]; extra = true; }
    if (extra) Store.saveExtras();
    toast(`Importé : ${ns ? ns + " séance" + (ns > 1 ? "s" : "") + ", " : ""}${ne} exercice${ne > 1 ? "s" : ""}, ${nw} échauffement${nw > 1 ? "s" : ""}.`);
    if (ns) UI.tab = "se"; else if (ne && !nw) UI.tab = "ex"; else if (nw && !ne) UI.tab = "wu";
    location.hash = "#/"; renderLibrary();
  }
}

boot();
</script>
